<title>Gamma Operations</title>
<style>/*__FONTS__*/</style>
<style>/*__GLASS_CSS__*/

/* ============================================================
   Panel de administración — disposición
   ============================================================ */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
.login-card{width:100%;max-width:410px;padding:38px 34px;text-align:center;}
.login-card img{width:118px;height:auto;margin-bottom:20px;filter:drop-shadow(0 8px 18px rgba(6,64,43,.18));}
.login-card h1{font-size:var(--t-2xl);margin-bottom:6px;}
.login-card .sub{color:var(--text-dim);font-size:var(--t-sm);margin-bottom:26px;line-height:1.55;}
.login-card .field{text-align:left;}
.login-hint{margin-top:18px;font-size:var(--t-xs);color:var(--text-faint);line-height:1.6;}

.layout{display:flex;min-height:100vh;}

.rail{
  position:sticky;top:0;height:100vh;flex:none;width:230px;
  display:flex;flex-direction:column;gap:22px;padding:22px 16px;
  border-radius:0 var(--r-xl) var(--r-xl) 0;
}
.rail-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 0;}
.rail-brand img{width:42px;height:auto;flex:none;}
.rail-brand b{display:block;font-weight:700;color:var(--green);font-size:15px;letter-spacing:.01em;line-height:1.15;}
.rail-brand span{font-weight:600;font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--text-faint);}
nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-btn{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 13px;border-radius:var(--r-sm);
  font-size:var(--t-md);font-weight:500;color:var(--text-dim);text-align:left;
  transition:all .35s var(--ease);
}
.nav-btn svg{width:17px;height:17px;flex:none;opacity:.75;}
.nav-btn:hover{background:var(--glass-2);color:var(--text);}
.nav-btn.active{
  background:linear-gradient(120deg,var(--green-lit),var(--green));
  color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 22px -12px rgba(6,64,43,.75);
}
.nav-btn.active svg{opacity:1;}
.nav-badge{
  margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  display:grid;place-items:center;
  background:var(--st-flag);color:#fff;
  font-size:10.5px;font-weight:600;
}
.rail-foot{padding:0 6px;border-top:1px solid var(--glass-brd);padding-top:15px;}
.rail-user{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.avatar{
  width:33px;height:33px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--green-lit),var(--green));color:#fff;
  font-weight:700;font-size:12.5px;
}
.rail-user b{display:block;font-size:var(--t-sm);font-weight:600;}
.rail-user span{font-size:10.5px;color:var(--text-faint);}

main{flex:1;min-width:0;padding:30px 34px 70px;}
.page-head{margin-bottom:26px;}
.page-head h1{font-size:var(--t-3xl);line-height:1.05;margin-bottom:5px;}
.page-head .sub{color:var(--text-dim);font-size:var(--t-md);}
.head-row{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:15px;margin-bottom:26px;}
.kpi{padding:19px;}
.kpi .v{font-weight:700;font-size:var(--t-3xl);line-height:1;margin-bottom:7px;font-variant-numeric:tabular-nums;}
.kpi .k{font-weight:600;font-size:10px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--text-dim);line-height:1.5;}
.kpi-bar{height:3px;border-radius:99px;margin-top:13px;background:currentColor;opacity:.55;}

.cols{display:grid;grid-template-columns:1.25fr .95fr;gap:18px;align-items:start;}
.tile-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;}
.tile-head h2{font-size:var(--t-lg);}

/* Mapa simulado */
.map{position:relative;height:315px;border-radius:var(--r-md);overflow:hidden;
  background:
    linear-gradient(rgba(6,64,43,.07) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,rgba(6,64,43,.07) 1px,transparent 1px) 0 0/34px 100%,
    radial-gradient(circle at 30% 25%,rgba(6,64,43,.10),transparent 55%),
    rgba(255,255,255,.55);
  box-shadow:inset 0 0 0 1px var(--glass-brd);}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px;}
.pin i{width:11px;height:11px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 4px rgba(6,64,43,.16);animation:pulse 2.6s ease-in-out infinite;}
.pin.busy i{background:var(--st-progress);box-shadow:0 0 0 4px rgba(184,92,16,.2);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(6,64,43,.18);}50%{box-shadow:0 0 0 10px rgba(6,64,43,0);}}
.pin b{font-weight:600;font-size:9.5px;padding:3px 7px;border-radius:5px;
  background:#fff;color:var(--green);box-shadow:0 3px 9px -3px rgba(6,64,43,.4);white-space:nowrap;letter-spacing:.04em;}
.map-note{position:absolute;left:12px;bottom:11px;font-weight:600;
  font-size:9.5px;color:var(--text-faint);letter-spacing:.05em;}

/* Listas y tarjetas */
.stack{display:flex;flex-direction:column;gap:11px;}
.row-card{padding:15px 17px;border-radius:var(--r-md);}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:13px;margin-bottom:6px;}
.row-card h3{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em;color:var(--text);}
.meta{font-weight:600;font-size:var(--t-xs);color:var(--text-dim);
  letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:7px;align-items:center;}
.meta .dot{opacity:.4;}
.note-box{margin-top:11px;padding:11px 13px;border-radius:var(--r-sm);
  background:rgba(6,64,43,.05);font-size:var(--t-sm);line-height:1.6;color:var(--text-dim);
  box-shadow:inset 0 0 0 1px rgba(6,64,43,.07);}
.note-box b{color:var(--green);font-weight:600;}

/* Enlace a Google Maps */
.map-link{
  display:inline-flex;align-items:center;gap:5px;
  color:var(--green);font-weight:600;text-decoration:none;
  border-bottom:1px solid rgba(6,64,43,.28);
  transition:all .25s var(--ease);
}
.map-link:hover{color:var(--green-lit);border-bottom-color:var(--green-lit);}
.map-link svg{width:13px;height:13px;flex:none;}

/* Traducción de notas del campo */
.note-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.tr-btn{
  display:inline-flex;align-items:center;gap:5px;flex:none;
  padding:3px 10px;border-radius:999px;
  font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  background:rgba(6,64,43,.07);color:var(--green);
  box-shadow:inset 0 0 0 1px rgba(6,64,43,.14);
  transition:all .25s var(--ease);
}
.tr-btn:hover{background:var(--green);color:#fff;}
.tr-btn.is-on{background:var(--green);color:#fff;}
.tr-flag{font-size:9.5px;color:var(--text-faint);font-weight:600;letter-spacing:.1em;text-transform:uppercase;}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}

/* Cuadrillas */
.crew-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:16px;}
.crew-top{display:flex;align-items:center;gap:12px;margin-bottom:15px;}
.crew-top .avatar{width:44px;height:44px;font-size:15px;}
.crew-top b{display:block;font-size:var(--t-lg);font-weight:700;color:var(--green);}
.crew-top span{font-weight:600;font-size:var(--t-xs);color:var(--text-faint);}
.crew-line{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:9px 0;border-top:1px solid rgba(6,64,43,.09);}
.crew-line > span:first-child{font-weight:600;font-size:var(--t-xs);
  text-transform:uppercase;letter-spacing:.11em;color:var(--text-faint);}
.skills-box{margin-top:13px;padding-top:13px;border-top:1px solid rgba(6,64,43,.09);}
.skills-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.stepper{display:flex;align-items:center;gap:9px;}
.stepper button{width:25px;height:25px;border-radius:7px;background:var(--glass-2);
  color:var(--text);font-size:15px;line-height:1;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--glass-brd);transition:all .25s var(--ease);}
.stepper button:hover{background:var(--glass-3);}
.stepper button:active{transform:scale(.88);}
.stepper b{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;}

/* ============================================================
   Cronograma: todo el año, en vista semanal
   ============================================================ */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding:12px 15px;}
.cal-nav{display:flex;align-items:center;gap:4px;}
.cal-nav button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--glass-2);color:var(--green);font-size:15px;
  box-shadow:inset 0 0 0 1px var(--glass-brd);transition:all .25s var(--ease);}
.cal-nav button:hover{background:var(--green);color:#fff;}
.cal-nav button:active{transform:scale(.9);}
.cal-range{font-weight:700;font-size:var(--t-md);color:var(--green);min-width:210px;}
.cal-range span{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-faint);}
.cal-spacer{flex:1;}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
.day{padding:12px 11px;border-radius:var(--r-md);min-height:190px;}
.day.off{opacity:.62;}
.day-h{margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid rgba(6,64,43,.10);}
.day-h b{font-weight:600;font-size:10px;text-transform:uppercase;
  letter-spacing:.12em;color:var(--text-faint);display:block;}
.day-h i{font-weight:700;font-style:normal;font-size:var(--t-xl);}
.day.today .day-h i{color:var(--green);}
.day.today{box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 2px var(--green),var(--shadow);}

/* Cada trabajo se colorea por estado; sin asignar va sin color ni icono. */
.cal-chip{
  position:relative;display:flex;gap:7px;align-items:flex-start;
  padding:8px 9px;border-radius:9px;margin-bottom:7px;cursor:pointer;
  font-size:10.5px;line-height:1.4;
  background:rgba(255,255,255,.8);
  box-shadow:inset 0 0 0 1px var(--glass-brd);
  border-left:3px solid transparent;
  transition:all .3s var(--ease);
}
.cal-chip:hover{background:#fff;transform:translateX(2px);}
.cal-chip b{display:block;font-weight:600;margin-bottom:2px;}
.cal-chip .cal-sub{font-weight:600;color:var(--text-faint);font-size:9.5px;}
.cal-ic{flex:none;width:14px;height:14px;margin-top:1px;}
.cal-ic svg{width:14px;height:14px;display:block;}
.cal-chip.st-done     {border-left-color:var(--st-done);   background:rgba(6,64,43,.09);}
.cal-chip.st-done .cal-ic{color:var(--st-done);}
.cal-chip.st-assigned {border-left-color:#D97A16;          background:rgba(217,122,22,.11);}
.cal-chip.st-assigned .cal-ic{color:#A2510C;}
.cal-chip.st-progress {border-left-color:#D97A16;          background:rgba(217,122,22,.11);}
.cal-chip.st-progress .cal-ic{color:#A2510C;}
.cal-chip.st-flag     {border-left-color:#C42B1C;          background:rgba(196,43,28,.11);}
.cal-chip.st-flag .cal-ic{color:#A32014;}
/* Con rayo, la ficha reserva el hueco: si no, la dirección se le mete debajo. */
.cal-chip.has-bolt{padding-right:23px;}
.cal-bolt{position:absolute;top:6px;right:6px;width:12px;height:12px;color:#B85C10;}
.cal-bolt svg{width:12px;height:12px;display:block;}
.cal-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding:13px 16px;}
.leg{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);font-weight:600;color:var(--text-dim);}
.leg i{width:11px;height:11px;border-radius:3px;flex:none;}
.leg svg{width:13px;height:13px;}

/* Requerimientos */
.req-card{padding:16px 18px;border-radius:var(--r-md);border-left:3px solid var(--st-pending);}
.req-card.u-urgent{border-left-color:var(--st-flag);}
.req-card.u-normal{border-left-color:var(--st-assigned);}
.req-card.u-low{border-left-color:var(--st-pending);}
.req-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;}
.empty{padding:44px 22px;text-align:center;color:var(--text-faint);}
.empty b{display:block;font-weight:700;font-size:var(--t-lg);color:var(--text-dim);margin-bottom:7px;}

/* Consolidados de vaciados */
.sums{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px;margin-bottom:24px;}
.sum{padding:20px 22px;}
.sum-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
.sum-h b{font-weight:700;font-size:var(--t-lg);color:var(--green);}
.sum-v{font-weight:700;font-size:var(--t-3xl);line-height:1;font-variant-numeric:tabular-nums;color:var(--green);}
.sum-split{display:flex;gap:9px;margin-top:14px;}
.sum-part{flex:1;padding:10px 12px;border-radius:var(--r-sm);background:rgba(6,64,43,.05);
  box-shadow:inset 0 0 0 1px rgba(6,64,43,.07);}
.sum-part b{display:block;font-weight:700;font-size:var(--t-xl);font-variant-numeric:tabular-nums;}
.sum-part span{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.11em;color:var(--text-faint);}
.sum-crews{margin-top:14px;padding-top:13px;border-top:1px solid rgba(6,64,43,.09);}
.sum-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;font-size:var(--t-sm);}
.sum-row span{color:var(--text-dim);}
.sum-row b{font-variant-numeric:tabular-nums;}

/* Formularios: checklist múltiple y casillas */
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.check{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--glass-brd);
  cursor:pointer;font-size:var(--t-sm);font-weight:500;
  transition:all .25s var(--ease);
}
.check:hover{background:#fff;}
.check.on{background:var(--green-tint);box-shadow:inset 0 0 0 1.5px var(--green);color:var(--green);font-weight:600;}
.check .box{
  width:18px;height:18px;border-radius:5px;flex:none;display:grid;place-items:center;
  background:#fff;box-shadow:inset 0 0 0 1.5px rgba(6,64,43,.25);
  transition:all .25s var(--ease);
}
.check.on .box{background:var(--green);box-shadow:inset 0 0 0 1.5px var(--green);}
.check .box svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.5);
  transition:all .25s var(--ease);}
.check.on .box svg{opacity:1;transform:scale(1);}
.check-wide{width:100%;}

.ro-field{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 15px;border-radius:var(--r-sm);
  background:rgba(6,64,43,.05);box-shadow:inset 0 0 0 1px rgba(6,64,43,.08);
  font-size:var(--t-md);
}
.ro-field span{font-size:var(--t-xs);font-weight:600;text-transform:uppercase;
  letter-spacing:.11em;color:var(--text-faint);}
.ro-field b{font-weight:600;font-variant-numeric:tabular-nums;}

/* Subida de imágenes */
.up{
  display:grid;place-items:center;gap:6px;padding:20px 14px;border-radius:var(--r-md);
  background:rgba(6,64,43,.04);border:1.5px dashed rgba(6,64,43,.24);
  cursor:pointer;text-align:center;transition:all .25s var(--ease);
}
.up:hover{border-color:var(--green);background:rgba(6,64,43,.07);}
.up b{font-size:var(--t-sm);font-weight:600;color:var(--green);}
.up span{font-size:var(--t-xs);color:var(--text-faint);}
.up svg{width:20px;height:20px;color:var(--green);}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.thumb{position:relative;width:74px;height:60px;border-radius:9px;overflow:hidden;
  box-shadow:inset 0 0 0 1px var(--glass-brd);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb button{
  position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
  background:rgba(129,20,40,.92);color:#fff;font-size:11px;line-height:1;
  display:grid;place-items:center;transition:transform .2s var(--ease);
}
.thumb button:hover{transform:rotate(90deg) scale(1.1);}
.photo-row{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;}
.photo-row img{width:104px;height:78px;object-fit:cover;border-radius:10px;cursor:pointer;
  box-shadow:inset 0 0 0 1px var(--glass-brd);transition:transform .3s var(--ease);}
.photo-row img:hover{transform:scale(1.05);}
.sketch{width:100%;border-radius:var(--r-sm);margin-top:11px;display:block;
  box-shadow:inset 0 0 0 1px var(--glass-brd);}

.conn{display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  margin-bottom:11px;width:100%;justify-content:center;}
.conn i{width:7px;height:7px;border-radius:50%;flex:none;}
.conn-on {background:var(--green-tint);color:var(--green);box-shadow:inset 0 0 0 1px rgba(6,64,43,.2);}
.conn-on i{background:var(--green);}
.conn-off{background:rgba(147,130,110,.14);color:var(--text-dim);box-shadow:inset 0 0 0 1px rgba(147,130,110,.28);}
.conn-off i{background:var(--st-pending);}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;
  background:var(--green-tint);color:var(--green);box-shadow:inset 0 0 0 1px rgba(6,64,43,.14);}
.tag-wire{background:rgba(184,92,16,.13);color:#A2510C;box-shadow:inset 0 0 0 1px rgba(184,92,16,.28);
  display:inline-flex;align-items:center;gap:4px;}
.tag-wire svg{width:11px;height:11px;}

@media (max-width:1020px){
  .cols{grid-template-columns:1fr;}
  .week{grid-template-columns:repeat(3,1fr);}
}
@media (max-width:760px){
  .layout{flex-direction:column;}
  .rail{position:sticky;top:0;z-index:40;width:100%;height:auto;flex-direction:row;
    align-items:center;gap:12px;padding:11px 13px;border-radius:0 0 var(--r-lg) var(--r-lg);
    overflow-x:auto;}
  .rail-brand{padding:0;}
  .rail-brand div{display:none;}
  nav{flex-direction:row;gap:5px;}
  .nav-btn span{display:none;}
  .nav-btn{padding:10px 12px;}
  .rail-foot{border:none;padding:0;margin-left:auto;}
  .rail-user{margin:0;}
  .rail-user div{display:none;}
  .rail-foot .btn{display:none;}
  main{padding:22px 16px 60px;}
  .page-head h1{font-size:var(--t-2xl);}
  .week{grid-template-columns:1fr;}
  .cal-range{min-width:0;}
}
</style>

<div id="shell"></div>

/* ============================================================
   GAMMA TREE EXPERTS — Operations Dashboard

const LOGO = '__LOGO__';

const ICONS = {
  overview:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  orders:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h3"/></svg>',

function uid(p){ return p + '-' + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* Fechas: siempre a mediodía, para que el cambio de huso no corra el día. */
function atNoon(d){ const x=new Date(d); x.setHours(12,0,0,0); return x; }
function ymd(d){
  const x=atNoon(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function iso(offset){ const d=new Date(); d.setDate(d.getDate()+offset); return ymd(d); }
function addDays(d,n){ const x=atNoon(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=atNoon(d); return addDays(x,-((x.getDay()+6)%7)); }
function parseYmd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); }
function fmtDate(s){
  return parseYmd(s).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtStamp(ms){
  return new Date(ms).toLocaleString('en-US',
    {month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
}
function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function syncFromCrewApp(){
  const inbox = load('inbox', null);
  if(!inbox) return;
  let added = 0;
  for(const r of (inbox.requests||[])) if(!state.requests.some(x=>x.id===r.id)){ state.requests.unshift(r); added++; }
  for(const d of (inbox.dumps||[]))    if(!state.dumps.some(x=>x.id===d.id))   { state.dumps.unshift(d);    added++; }
  if(added) persist();
}
function persist(){
  // Conectado, la base manda: no se guarda copia local que pueda divergir.
  if(online()) return;
  const ok = save('admin', {crews:state.crews, orders:state.orders, dumps:state.dumps, requests:state.requests});
  if(!ok) toast('Storage is full — remove some photos to keep saving','warn');
}

/* Relee del servidor. RLS decide qué llega; el cliente no filtra nada. */
async function refresh(){
  if(!online()) return;
  try{ Object.assign(state, await pullAll()); }
  catch(e){ toast(e.message,'warn'); }
}

/* Toda mutación pasa por aquí: en modo local guarda y ya; conectado manda
   el cambio y vuelve a leer, de modo que la pantalla refleje el servidor y
   no una suposición del cliente. */
async function commit(cloudFn){
  if(!online()){ persist(); render(); return; }
  state.busy = true;
  try{ await cloudFn(); await refresh(); }
  catch(e){ toast(e.message,'warn'); await refresh(); }
  state.busy = false;
  render();
}

function startPolling(){
  clearInterval(pollTimer);
  if(!online()) return;
  // Sondeo y no websocket: es lo que sobrevive a proxies y a la pestaña
  // en segundo plano sin reconexiones raras.
  pollTimer = setInterval(async ()=>{
    // No interrumpir una ventana abierta, una escritura en curso ni a
    // alguien tecleando o con un desplegable abierto.
    if(state.modal || state.busy || isTyping()) return;
    const antes = snapshotSig(state);
    await refresh();
    if(snapshotSig(state) !== antes) render();   // solo si de verdad cambió
  }, 8000);
}

function connMessage(){
  if(state.connErr==='SANDBOX') return `<b>This published link cannot connect.</b><br>
    It runs inside a sandbox that blocks every outside request, whatever you paste.
    Download the file and open it from your computer, or put it on your own hosting —

  if(state.connErr==='DASHBOARD') return `<b>That is the Supabase dashboard address, not your project's.</b><br>
    The one you need is under <b>Settings → API → Project URL</b>, and looks like
    <code>https://abcdefgh.supabase.co</code>.`;
  if(state.connErr==='MALFORMED') return `<b>That does not look like a project URL.</b><br>
    It should look like <code>https://abcdefgh.supabase.co</code> — Settings → API → Project URL.`;
  if(state.connErr==='EMPTY') return `<b>The project URL is empty.</b>`;

  if(state.connErr==='NET') return `<b>No answer from that URL.</b><br>

  return esc(state.connErr);

function bindLogin(){
  const go = async ()=>{
    const email=document.getElementById('lg-email').value.trim();
    const pass=document.getElementById('lg-pass').value;
    state.loginErr=null; state.loginEmail=email;
    if(Gamma.online()){
      const btn=document.getElementById('lg-btn');
      btn.disabled=true; btn.textContent='Signing in…';
      try{ await Gamma.signIn(email,pass); }
      catch(e){
        state.loginErr = /invalid login credentials/i.test(e.message||'') ? 'BADLOGIN' : e.message;
        render(); return;
      }
      await refresh();
      startPolling();
    }
    state.loggedIn=true; render();
  };
  document.getElementById('lg-btn').onclick = go;
  document.getElementById('lg-email').oninput = (e)=>{ state.loginEmail=e.target.value; };

/* ---------- Nota del campo con traducción ----------

   sin perder el original. */
function fieldNote(id, text, label){
  const on = !!state.translated[id];
  const body = on ? toEnglish(text) : text;
  return `

      <span class="tr-flag">${label} · ${on?'English':'Español'}</span>

    </div>

  </div>`;
}

/* ---------- Cronograma: año completo, vista semanal ---------- */
function viewSchedule(){
  const start = state.weekStart;
  const end = addDays(start,6);
  const sameMonth = start.getMonth()===end.getMonth();
  const range = sameMonth
    ? `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${end.getDate()}, ${end.getFullYear()}`
    : `${MONTHS[start.getMonth()].slice(0,3)} ${start.getDate()} – ${MONTHS[end.getMonth()].slice(0,3)} ${end.getDate()}, ${end.getFullYear()}`;
  const todayY = ymd(new Date());

  return `
  <div class="page-head reveal">
    <div class="eyebrow">Full year · shown one week at a time</div>
    <h1>Schedule</h1>
    <div class="sub">Jump to any month, step through weeks, click a job to open it.</div>
  </div>

  <div class="glass cal-bar reveal">
    <div class="cal-nav">
      <button data-week="-1" title="Previous week" aria-label="Previous week">&lsaquo;</button>
      <button data-week="1" title="Next week" aria-label="Next week">&rsaquo;</button>
    </div>
    <div class="cal-range"><span>Week of</span>${range}</div>
    <div class="cal-spacer"></div>
    <select class="input" id="cal-month" style="width:auto;padding:9px 38px 9px 13px;font-size:13px;">
      ${MONTHS.map((m,i)=>`<option value="${i}" ${start.getMonth()===i?'selected':''}>${m}</option>`).join('')}
    </select>
    <div class="cal-nav">
      <button data-year="-1" title="Previous year" aria-label="Previous year">&lsaquo;</button>
      <div class="cal-range" style="min-width:0;padding:0 4px">${start.getFullYear()}</div>
      <button data-year="1" title="Next year" aria-label="Next year">&rsaquo;</button>
    </div>
    <button class="btn btn-glass btn-sm" id="cal-today">Today</button>
  </div>

  <div class="week">
    ${Array.from({length:7},(_,i)=>{
      const d = addDays(start,i), key = ymd(d);
      const jobs = state.orders.filter(o=>o.date===key);
      const isToday = key===todayY;
      const offMonth = d.getMonth()!==start.getMonth();
      return `
      <div class="glass glass-tile day reveal ${isToday?'today':''} ${offMonth?'off':''}" style="--i:${i}">
        <div class="day-h">
          <b>${DAYS[i]}${offMonth?' · '+MONTHS[d.getMonth()].slice(0,3):''}</b>
          <i>${d.getDate()}</i>
        </div>
        ${jobs.map(o=>{
          const ic = CAL_ICON[o.status];
          return `
          <div class="cal-chip st-${o.status} ${o.dropWire?'has-bolt':''}" data-order="${o.id}">
            ${ic?`<span class="cal-ic">${ICONS[ic]}</span>`:''}
            <span style="min-width:0">
              <b>${esc(o.address.split(',')[0])}</b>
              <span class="cal-sub">${jobNames(o.jobs)}</span>
            </span>
            ${o.dropWire?`<span class="cal-bolt" title="Drop wire required">${ICONS.bolt}</span>`:''}
          </div>`;
        }).join('') || '<div class="eyebrow" style="opacity:.5">Clear</div>'}
      </div>`;
    }).join('')}
  </div>

  <div class="glass cal-legend reveal">
    <div class="leg"><span class="cal-ic" style="color:var(--st-done)">${ICONS.ok}</span> Done</div>
    <div class="leg"><span class="cal-ic" style="color:#A2510C">${ICONS.thumb}</span> Assigned</div>
    <div class="leg"><span class="cal-ic" style="color:#A2510C">${ICONS.run}</span> In progress</div>
    <div class="leg"><span class="cal-ic" style="color:#A32014">${ICONS.warn}</span> Needs reassign</div>
    <div class="leg"><i style="background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px var(--glass-brd)"></i> Unassigned</div>
    <div class="leg"><span class="cal-ic" style="color:#B85C10">${ICONS.bolt}</span> Drop wire required</div>
  </div>`;
}

/* ---------- Vaciados, con consolidados ---------- */
function viewDumps(){
  const now = new Date();
  const todayKey = ymd(now);
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0).getTime();
  const mEnd   = new Date(now.getFullYear(), now.getMonth()+1, 0, 23, 59, 59).getTime();

  const ofToday = state.dumps.filter(d=>ymd(new Date(d.at))===todayKey);
  const ofMonth = state.dumps.filter(d=>d.at>=mStart && d.at<=mEnd);
  const byType  = (arr,t)=>arr.filter(d=>d.type===t).length;
  const byCrew  = (arr)=>state.crews
    .map(c=>({name:c.name, n:arr.filter(d=>d.crew===c.id).length}))
    .filter(r=>r.n>0).sort((a,b)=>b.n-a.n);

  const sumTile = (title, sub, arr, i) => `
    <div class="glass glass-tile sum reveal" style="--i:${i}">
      <div class="sum-h">
        <div><b>${title}</b><div class="eyebrow" style="margin-top:3px">${sub}</div></div>
        <div class="sum-v num" data-count="${arr.length}">0</div>
      </div>
      <div class="sum-split">
        <div class="sum-part"><b class="num">${byType(arr,'chips')}</b><span>Chips</span></div>
        <div class="sum-part"><b class="num">${byType(arr,'logs')}</b><span>Logs</span></div>
      </div>
      ${byCrew(arr).length?`
        <div class="sum-crews">
          ${byCrew(arr).map(r=>`<div class="sum-row"><span>${esc(r.name)}</span><b>${r.n}</b></div>`).join('')}
        </div>`:''}
    </div>`;

  const list=[...state.dumps].sort((a,b)=>b.at-a.at);
  return `
  <div class="page-head reveal">
    <div class="eyebrow">Reported from the field</div>
    <h1>Dump reports</h1>
    <div class="sub">Every load the crews drop, totalled by day and by month.</div>
  </div>

  <div class="sums">
    ${sumTile('Today', now.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}), ofToday, 0)}
    ${sumTile('This month',
      `${MONTHS[now.getMonth()]} 1 – ${new Date(now.getFullYear(),now.getMonth()+1,0).getDate()}, ${now.getFullYear()}`,
      ofMonth, 1)}
  </div>

  <div class="divider-head eyebrow reveal" style="margin-bottom:12px">All reports</div>
  <div class="stack">
    ${list.length? list.map((d,i)=>`
      <div class="glass glass-tile row-card reveal" style="--i:${i}">
        <div class="row-top">
          <h3>${esc(d.location)}</h3>
          <span class="pill ${d.type==='chips'?'pill-done':'pill-assigned'}">${d.type}</span>
        </div>
        <div class="meta">
          <span>${esc(crewName(d.crew))}</span><span class="dot">·</span>
          <span>${ago(d.at)}</span><span class="dot">·</span>
          <span>${fmtStamp(d.at)}</span>
        </div>
        ${d.notes?fieldNote('dp-'+d.id, d.notes, 'Crew note'):''}
      </div>`).join('')
    : emptyState('No dumps logged','Reports from the crew app will land here.')}
  </div>`;
}

      <div class="field">
        <label>Job type — pick all that apply</label>
        <div class="check-grid">
          ${Object.entries(JOBS).map(([k,v])=>`
            <button type="button" class="check ${d.jobs.includes(k)?'on':''}" data-job="${k}">
              <span class="box">${ICONS.tick}</span><span>${v}</span>
            </button>`).join('')}
        </div>
      </div>

      <div class="field">
        <button type="button" class="check check-wide ${d.dropWire?'on':''}" data-wire>
          <span class="box">${ICONS.tick}</span>
          <span>Drop wire required <span style="opacity:.7">— power line must be dropped</span></span>
        </button>
      </div>

      <div class="field"><label for="f-crew">Assign crew</label>
        <select id="f-crew" class="input"><option value="">— Unassigned —</option>
          ${state.crews.map(c=>`<option value="${c.id}" ${d.crew===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>

      <div class="field"><label for="f-notes">Instructions</label>
        <textarea id="f-notes" class="input" placeholder="What the crew needs to know on site.">${esc(d.notes)}</textarea></div>

      <div class="field">
        <label>Job photos</label>
        <label class="up" for="f-photos">
          ${ICONS.camera}<b>Add photos of the job</b>
          <span>Camera or gallery · you can pick several</span>
        </label>
        <input type="file" id="f-photos" accept="image/*" capture="environment" multiple style="display:none">
        ${d.photos.length?`<div class="thumbs">${d.photos.map((p,i)=>`
          <div class="thumb"><img src="${p}" alt=""><button data-rmphoto="${i}" aria-label="Remove photo">&times;</button></div>`).join('')}</div>`:''}
      </div>

      <div class="field">
        <label>Sketch</label>
        <label class="up" for="f-sketch">
          ${ICONS.pencil}<b>Upload the job sketch</b>
          <span>Camera or gallery · the drawing that explains the work</span>
        </label>
        <input type="file" id="f-sketch" accept="image/*" capture="environment" style="display:none">
        ${d.sketch?`<div class="thumbs"><div class="thumb" style="width:110px;height:76px">
          <img src="${d.sketch}" alt=""><button data-rmsketch aria-label="Remove sketch">&times;</button></div></div>`:''}
      </div>

      <button class="btn btn-primary" id="f-save" style="width:100%">Create order</button>
    </div>
  </div>`;
}

/* ============================================================
   Eventos
   ============================================================ */
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    // Se pinta al instante para que el cambio de sección se sienta inmediato,
    // y en paralelo se piden datos frescos: entrar a una sección es
    // justamente cuando uno quiere ver lo último, no lo que quedó en memoria.
    b.onclick=async()=>{
      state.view=b.dataset.nav; state.filter='all'; render();
      if(online()){ const antes=snapshotSig(state); await refresh();
        if(snapshotSig(state)!==antes) render(); }
    };
  });
  document.getElementById('logout').onclick=async()=>{
    clearInterval(pollTimer);
    if(Gamma.online()) await Gamma.signOut();
    state.loggedIn=false; state.view='overview'; render();
  };

  document.querySelectorAll('[data-order]').forEach(el=>{
    el.onclick=(e)=>{
      if(e.target.closest('select,input,a,.tr-btn,[data-zoom]')) return;
      state.modal={type:'viewOrder',id:el.dataset.order}; render();
    };
  });
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.onclick=()=>{ state.filter=b.dataset.filter; render(); };
  });
  document.querySelectorAll('[data-zoom]').forEach(img=>{
    img.onclick=(e)=>{ e.stopPropagation(); state.modal={type:'zoom',src:img.dataset.zoom}; render(); };
  });

  /* Traducción de notas del campo */
  document.querySelectorAll('[data-tr]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const id=b.dataset.tr;
      state.translated[id]=!state.translated[id];
      render();
    };
  });

  document.getElementById('new-order')?.addEventListener('click',()=>{
    // La fecha de apertura se fija aquí y ya no se puede tocar.
    state.draft={createdAt:Date.now(), address:'', date:iso(0), jobs:[], gear:'bucket',
                 dropWire:false, crew:'', notes:'', photos:[], sketch:null};
    state.modal={type:'newOrder'}; render();
  });
  document.getElementById('new-crew')?.addEventListener('click',()=>{
    state.crewDraft={leader:'', name:'', email:'', gear:'bucket', members:3, skills:[]};
    state.modal={type:'newCrew'}; render();
  });

  document.querySelectorAll('[data-assign]').forEach(sel=>{
    sel.onchange=()=>{
      const o=state.orders.find(x=>x.id===sel.dataset.assign);
      o.crew=sel.value||null;
      if(o.crew && (o.status==='pending'||o.status==='flag')) o.status='assigned';
      else if(!o.crew && o.status==='assigned') o.status='pending';
      toast(o.crew?`Assigned to ${crewName(o.crew)}`:'Order unassigned');
      commit(()=>Gamma.patch('work_orders', o.id, {group_id:o.crew, state:o.status}));
    };
  });
  document.querySelectorAll('[data-resched]').forEach(inp=>{
    inp.onchange=()=>{
      const o=state.orders.find(x=>x.id===inp.dataset.resched);
      o.date=inp.value; toast(`Rescheduled to ${fmtDate(o.date)}`);
      commit(()=>Gamma.patch('work_orders', o.id, {scheduled_date:o.date}));
    };
  });

  /* Cronograma */
  document.querySelectorAll('[data-week]').forEach(b=>{
    b.onclick=()=>{ state.weekStart=addDays(state.weekStart, 7*Number(b.dataset.week)); render(); };
  });
  document.querySelectorAll('[data-year]').forEach(b=>{
    b.onclick=()=>{
      const d=new Date(state.weekStart);
      d.setFullYear(d.getFullYear()+Number(b.dataset.year));
      state.weekStart=mondayOf(d); render();
    };
  });
  document.getElementById('cal-month')?.addEventListener('change',(e)=>{
    // Saltar de mes lleva a la semana que contiene su día 1.
    state.weekStart=mondayOf(new Date(state.weekStart.getFullYear(), Number(e.target.value), 1, 12));
    render();
  });
  document.getElementById('cal-today')?.addEventListener('click',()=>{
    state.weekStart=mondayOf(new Date()); render();
  });

  /* Cuadrillas */
  document.querySelectorAll('[data-rmskill]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const c=crewById(b.dataset.rmskill), skill=b.dataset.skill;
      c.skills=c.skills.filter(s=>s!==skill);
      toast(`${SKILLS[skill]} removed from ${c.name}`);
      commit(()=>Gamma.remove('group_skills', `group_id=eq.${c.id}&skill=eq.${skill}`));
    };
  });
  document.querySelectorAll('[data-addskill]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'addSkill',id:b.dataset.addskill}; render(); };
  });
  document.querySelectorAll('[data-gear]').forEach(sel=>{
    sel.onchange=()=>{
      const c=crewById(sel.dataset.gear); c.gear=sel.value;
      toast('Equipment updated');
      commit(()=>Gamma.patch('groups', c.id, {equipment_type:GEAR_TO_DB[c.gear]}));
    };
  });
  document.querySelectorAll('[data-members]').forEach(b=>{
    b.onclick=()=>{
      const c=crewById(b.dataset.members);
      c.members=Math.max(1,Math.min(12,c.members+Number(b.dataset.delta)));
      commit(()=>Gamma.patch('groups', c.id, {member_count:c.members}));
    };
  });

  /* Requerimientos */
  document.querySelectorAll('[data-req]').forEach(b=>{
    b.onclick=()=>{
      const r=state.requests.find(x=>x.id===b.dataset.req);
      r.status=b.dataset.to;
      toast(`Request marked ${REQ_STATUS[r.status].toLowerCase()}`);
      commit(()=>Gamma.patch('equipment_requests', r.id, {state:r.status}));
    };
  });
}

function bindModal(){
  document.querySelectorAll('[data-close]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target===el){ state.modal=null; render(); } };
  });
  document.querySelectorAll('[data-tr]').forEach(b=>{
    b.onclick=(e)=>{ e.stopPropagation(); state.translated[b.dataset.tr]=!state.translated[b.dataset.tr]; render(); };
  });

  document.getElementById('cf-save')?.addEventListener('click',async()=>{
    const url=document.getElementById('cf-url').value.trim();
    const key=document.getElementById('cf-key').value.trim();
    const problem = urlProblem(url);
    if(problem){ state.connErr = problem; render(); return; }
    if(key.length<20){ toast('That anon key looks too short','warn'); return; }
    const btn=document.getElementById('cf-save'); btn.disabled=true; btn.textContent='Testing…';
    Gamma.configure(url,key);
    try{
      // Una lectura real: confirma URL, llave y que el esquema esté aplicado.
      await Gamma.get('groups?select=id&limit=1');
      state.modal=null; render();
      toast('Connected — sign in with your Supabase account');
    }catch(e){
      Gamma.disconnect();
      state.connErr = /invalid path/i.test(e.message||'')
        ? 'PATH' : (connectionHint(e) || e.message);
      render();
    }
  });
  document.getElementById('cf-off')?.addEventListener('click',()=>{
    Gamma.disconnect(); clearInterval(pollTimer);
    state.loggedIn=false; state.modal=null; render();
    toast('Disconnected — back to demo mode');
  });

  /* --- Formulario de orden: el borrador guarda lo tecleado entre renders --- */
  const grab=()=>{
    const d=state.draft; if(!d) return;
    d.address=document.getElementById('f-addr')?.value ?? d.address;
    d.date=document.getElementById('f-date')?.value ?? d.date;
    d.gear=document.getElementById('f-gear')?.value ?? d.gear;
    d.crew=document.getElementById('f-crew')?.value ?? d.crew;
    d.notes=document.getElementById('f-notes')?.value ?? d.notes;
  };
  document.querySelectorAll('[data-job]').forEach(b=>{
    b.onclick=()=>{
      grab();
      const k=b.dataset.job, js=state.draft.jobs;
      state.draft.jobs = js.includes(k) ? js.filter(x=>x!==k) : [...js,k];
      render();
    };
  });
  document.querySelector('[data-wire]')?.addEventListener('click',()=>{
    grab(); state.draft.dropWire=!state.draft.dropWire; render();
  });
  document.getElementById('f-photos')?.addEventListener('change',async(e)=>{
    grab();
    for(const f of [...e.target.files]) state.draft.photos.push(await readImage(f));
    render();
  });
  document.getElementById('f-sketch')?.addEventListener('change',async(e)=>{
    grab();
    const f=e.target.files?.[0]; if(f) state.draft.sketch=await readImage(f,1400,.82);
    render();
  });
  document.querySelectorAll('[data-rmphoto]').forEach(b=>{
    b.onclick=()=>{ grab(); state.draft.photos.splice(Number(b.dataset.rmphoto),1); render(); };
  });
  document.querySelector('[data-rmsketch]')?.addEventListener('click',()=>{
    grab(); state.draft.sketch=null; render();
  });
  document.getElementById('f-save')?.addEventListener('click',()=>{
    grab();
    const d=state.draft;
    if(!d.address.trim()){ toast('An address is required','warn'); return; }
    if(!d.jobs.length){ toast('Pick at least one job type','warn'); return; }
    const fresh={
      id:uid('WO'), address:d.address.trim(), createdAt:d.createdAt, date:d.date,
      jobs:d.jobs, gear:d.gear, dropWire:d.dropWire, notes:d.notes.trim(),
      photos:d.photos, sketch:d.sketch,
      status:d.crew?'assigned':'pending', crew:d.crew||null,
    };
    state.modal=null; state.draft=null; state.view='orders';
    if(!online()){ state.orders.unshift(fresh); persist(); render(); toast('Work order created'); return; }
    commit(async()=>{
      // Las imágenes van primero al bucket; en la fila solo queda su URL.
      const sketchUrl = fresh.sketch ? await Gamma.upload('order-sketches','sketch.jpg',fresh.sketch) : null;
      const urls = [];
      for(const ph of fresh.photos) urls.push(await Gamma.upload('order-photos','job.jpg',ph));
      const [row] = await Gamma.insert('work_orders', Map2.orderToRow({...fresh, sketch:sketchUrl}));
      if(urls.length) await Gamma.insert('work_order_photos', urls.map(u=>({work_order_id:row.id, url:u})));
    }).then(()=>toast('Work order created'));
  });

  /* --- Formulario de cuadrilla --- */
  const grabCrew=()=>{
    const d=state.crewDraft; if(!d) return;
    d.leader=document.getElementById('c-leader')?.value ?? d.leader;
    d.name=document.getElementById('c-name')?.value ?? d.name;
    d.email=document.getElementById('c-email')?.value ?? d.email;
    d.gear=document.getElementById('c-gear')?.value ?? d.gear;
    d.members=Number(document.getElementById('c-members')?.value ?? d.members);
  };
  document.querySelectorAll('[data-cskill]').forEach(b=>{
    b.onclick=()=>{
      grabCrew();
      const k=b.dataset.cskill, ss=state.crewDraft.skills;
      state.crewDraft.skills = ss.includes(k) ? ss.filter(x=>x!==k) : [...ss,k];
      render();
    };
  });
  document.getElementById('c-save')?.addEventListener('click',()=>{
    grabCrew();
    const d=state.crewDraft;
    if(!d.leader.trim()){ toast('The crew leader name is required','warn'); return; }
    if(!/^\S+@\S+\.\S+$/.test(d.email.trim())){ toast('A valid email is required — it is their app login','warn'); return; }
    if(state.crews.some(c=>c.email.toLowerCase()===d.email.trim().toLowerCase())){
      toast('That email already belongs to another crew','warn'); return;
    }
    const crew={
      id:uid('c'), name:d.name.trim() || `${d.leader.trim().split(/\s+/)[0]}'s Crew`,
      leader:d.leader.trim(), email:d.email.trim().toLowerCase(),
      gear:d.gear, members:Math.max(1,Math.min(12,d.members||1)),
      skills:d.skills,
      x:15+Math.round(Math.random()*70), y:20+Math.round(Math.random()*60),
    };
    state.modal=null; state.crewDraft=null;
    if(!online()){ state.crews.push(crew); persist(); render(); toast('Crew created'); return; }
    commit(async()=>{
      const [row] = await Gamma.insert('groups', Map2.crewToRow(crew));
      if(crew.skills.length)
        await Gamma.insert('group_skills', crew.skills.map(skill=>({group_id:row.id, skill})));
    }).then(()=>toast('Crew created'));
  });

  document.querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick=()=>{
      const c=crewById(state.modal.id), skill=b.dataset.pick;
      c.skills.push(skill);
      state.modal=null;
      toast(`${SKILLS[skill]} added to ${c.name}`);
      commit(()=>Gamma.insert('group_skills', {group_id:c.id, skill}));
    };
  });
  document.addEventListener('keydown',function onEsc(e){
    if(e.key==='Escape'){ state.modal=null; render(); document.removeEventListener('keydown',onEsc); }
  });
}

/* ---------- Arranque ---------- */
initGlass();
syncFromCrewApp();
addEventListener('storage',(e)=>{ if(e.key&&e.key.includes('inbox')){ syncFromCrewApp(); render(); } });
render();
</script>
