/* ============================================================
   App de líderes — disposición de teléfono
   ============================================================ */
#shell{max-width:470px;margin:0 auto;min-height:100vh;padding-bottom:96px;}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;}
.login-card{width:100%;max-width:390px;padding:34px 28px;text-align:center;}
.login-card img{width:104px;height:auto;margin-bottom:18px;filter:drop-shadow(0 8px 18px rgba(6,64,43,.18));}
.login-card h1{font-size:var(--t-xl);margin-bottom:5px;}
.login-card .sub{color:var(--text-dim);font-size:var(--t-sm);margin-bottom:24px;line-height:1.55;}
.login-card .field{text-align:left;}
.login-hint{margin-top:16px;padding-top:14px;border-top:1px solid var(--glass-brd);
  font-size:var(--t-xs);color:var(--text-faint);line-height:1.75;text-align:left;}
.login-hint b{color:var(--text-dim);}
.err{margin:-4px 0 12px;padding:10px 13px;border-radius:var(--r-sm);
  background:var(--wine-tint);box-shadow:inset 0 0 0 1px rgba(129,20,40,.28);
  color:var(--wine);font-size:var(--t-sm);text-align:left;}

.topbar{
  position:sticky;top:0;z-index:30;margin:0 0 16px;padding:13px 16px;
  border-radius:0 0 var(--r-lg) var(--r-lg);
  display:flex;align-items:center;gap:12px;
}
.topbar img{width:36px;height:auto;flex:none;}
.topbar .who{min-width:0;flex:1;}
.topbar .who b{display:block;font-size:var(--t-md);font-weight:600;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.topbar .who span{font-weight:600;font-size:10px;color:var(--text-faint);
  letter-spacing:.05em;}
.lang{display:flex;padding:3px;border-radius:999px;background:rgba(6,64,43,.07);flex:none;
  box-shadow:inset 0 0 0 1px var(--glass-brd);}
.lang button{padding:5px 11px;border-radius:999px;font-size:10.5px;font-weight:700;
  letter-spacing:.06em;color:var(--text-faint);transition:all .3s var(--ease);}
.lang button.on{background:linear-gradient(140deg,var(--green-lit),var(--green));color:#fff;
  box-shadow:0 4px 12px -5px rgba(6,64,43,.7);}

.body{padding:0 15px;}
.sec-head{margin-bottom:15px;}
.sec-head h1{font-size:var(--t-xl);line-height:1.15;margin-bottom:3px;}
.sec-head .sub{color:var(--text-dim);font-size:var(--t-sm);}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px;}
.stat{padding:14px 12px;text-align:center;}
.stat .v{font-weight:700;font-size:var(--t-2xl);line-height:1;margin-bottom:5px;
  font-variant-numeric:tabular-nums;}
.stat .k{font-weight:600;font-size:9px;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text-dim);line-height:1.4;}

.job{padding:17px;margin-bottom:12px;}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:11px;margin-bottom:7px;}
.job h3{font-size:var(--t-lg);font-weight:600;letter-spacing:-.015em;color:var(--text);line-height:1.3;}
.job .meta{font-weight:600;font-size:var(--t-xs);color:var(--text-dim);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;letter-spacing:.03em;}
.job .meta .dot{opacity:.4;}
.job-actions{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.row2{display:flex;gap:9px;}
.row2 .btn{flex:1;}

.sketch-btn{
  display:flex;align-items:center;gap:11px;width:100%;padding:11px;border-radius:var(--r-sm);
  background:rgba(6,64,43,.05);box-shadow:inset 0 0 0 1px var(--glass-brd);
  text-align:left;font-size:var(--t-sm);font-weight:600;color:var(--green);
  transition:all .3s var(--ease);
}
.sketch-btn:hover{background:rgba(6,64,43,.09);}
.sketch-btn img{width:44px;height:34px;object-fit:cover;border-radius:6px;flex:none;}

.seg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}

.photo-drop{
  display:grid;place-items:center;gap:7px;padding:26px 16px;margin-bottom:14px;
  border-radius:var(--r-md);cursor:pointer;text-align:center;
  background:rgba(6,64,43,.04);
  border:1.5px dashed rgba(6,64,43,.24);
  transition:all .3s var(--ease);
}
.photo-drop:hover{border-color:var(--green);background:rgba(6,64,43,.07);}
.photo-drop span{font-size:var(--t-sm);color:var(--text-dim);}
.photo-drop img{max-width:100%;max-height:190px;border-radius:var(--r-sm);display:block;}

.tabs{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;
  width:calc(100% - 30px);max-width:440px;
  display:flex;gap:4px;padding:6px;border-radius:999px;
}
.tab-btn{
  position:relative;overflow:hidden;flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px;border-radius:999px;
  font-size:9.5px;font-weight:600;letter-spacing:.04em;color:var(--text-faint);
  transition:all .35s var(--ease);
}
.tab-btn svg{width:19px;height:19px;}
.tab-btn.on{
  background:linear-gradient(140deg,var(--green-lit),var(--green));color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 20px -8px rgba(6,64,43,.7);
}
.tab-badge{
  position:absolute;top:5px;right:calc(50% - 20px);
  min-width:15px;height:15px;padding:0 4px;border-radius:999px;
  display:grid;place-items:center;background:var(--wine);color:#fff;
  font-size:9px;font-weight:700;
}

.hist{padding:14px 16px;margin-bottom:10px;border-radius:var(--r-md);}
.hist-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:5px;}
.hist b{font-size:var(--t-md);font-weight:600;}
.divider{display:flex;align-items:center;gap:11px;margin:22px 0 13px;}
.divider span{font-weight:600;font-size:var(--t-xs);text-transform:uppercase;
  letter-spacing:.14em;color:var(--text-faint);white-space:nowrap;}
.divider::after{content:'';flex:1;height:1px;background:var(--glass-brd);}

.conn{display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 11px;
  border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:11px;}
.conn i{width:7px;height:7px;border-radius:50%;flex:none;}
.conn-on {background:var(--green-tint);color:var(--green);box-shadow:inset 0 0 0 1px rgba(6,64,43,.2);}
.conn-on i{background:var(--green);}
.conn-off{background:rgba(147,130,110,.14);color:var(--text-dim);box-shadow:inset 0 0 0 1px rgba(147,130,110,.28);}
.conn-off i{background:var(--st-pending);}
.map-link{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-weight:600;
  text-decoration:none;border-bottom:1px solid rgba(6,64,43,.28);transition:all .25s var(--ease);}
.map-link:hover{color:var(--green-lit);}
.map-link svg{width:13px;height:13px;flex:none;}
.map-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;
  margin-top:10px;border-radius:var(--r-sm);background:rgba(6,64,43,.05);
  box-shadow:inset 0 0 0 1px var(--glass-brd);color:var(--green);font-size:var(--t-sm);
  font-weight:600;text-decoration:none;transition:all .25s var(--ease);}
.map-btn:hover{background:rgba(6,64,43,.09);}
.map-btn svg{width:15px;height:15px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tag{padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;
  background:var(--green-tint);color:var(--green);box-shadow:inset 0 0 0 1px rgba(6,64,43,.14);}
.tag-wire{background:rgba(184,92,16,.13);color:#A2510C;box-shadow:inset 0 0 0 1px rgba(184,92,16,.28);
  display:inline-flex;align-items:center;gap:4px;}
.tag-wire svg{width:11px;height:11px;}
.photo-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.photo-row img{width:88px;height:66px;object-fit:cover;border-radius:9px;
  box-shadow:inset 0 0 0 1px var(--glass-brd);}

/* Foto de cierre. Una foto de teléfono es vertical y de miles de píxeles:
   sin acotar la altura ocupaba pantallas enteras dentro de la tarjeta. */
.done-shot{margin-top:12px;border-radius:var(--r-md);overflow:hidden;position:relative;
  cursor:pointer;box-shadow:inset 0 0 0 1px var(--glass-brd);}
.done-shot img{display:block;width:100%;height:170px;object-fit:cover;}
.done-shot b{position:absolute;left:10px;bottom:9px;padding:4px 10px;border-radius:999px;
  background:rgba(6,64,43,.86);color:#fff;font-size:10px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;}
</style>

const online = () => Gamma.online() && Gamma.signedIn();
let pollTimer = null;

const state = {
  lang: load('lang','es'),
  me: null,
  loginEmail: null,
  // Lo tecleado vive en el estado: así sobrevive a cualquier repintado.
  dumpDraft: {where:'', notes:''},
  reqDraft: {note:''},
  tab: 'jobs',
  modal: null,
  photo: null,
  dumpType: 'chips',
  reqCat: 'rope',
  reqUrg: 'normal',
  jobs: load('jobs', seedJobs()),
  dumps: load('mydumps', []),
  requests: load('myreqs', []),
  error: null,
};

async function refresh(){
  if(!online()) return;
  try{
    const data = await pullAll();          // RLS deja pasar solo su cuadrilla
    state.jobs = data.orders;
    state.dumps = data.dumps;
    state.requests = data.requests;
  }catch(e){ toast(e.message,'warn'); }
}

async function commit(cloudFn){
  if(!online()){ persist(); render(); return; }
  state.busy = true;
  try{ await cloudFn(); await refresh(); }
  catch(e){ toast(e.message,'warn'); await refresh(); }
  state.busy = false;
  render();
}

function startPolling(){
  clearInterval(pollTimer);
  if(!online()) return;
  pollTimer = setInterval(async ()=>{
    // No interrumpir una ventana abierta, una escritura en curso ni a
    // alguien tecleando en un formulario.
    if(state.modal || state.busy || isTyping()) return;
    const antes = snapshotSig(state);
    await refresh();
    if(snapshotSig(state) !== antes) render();   // solo si de verdad cambió
  }, 8000);
}

function connBadge(){
  const T=t();
  return online() || Gamma.online()
    ? `<div class="conn conn-on"><i></i>${T.connOn}</div>`
    : `<div class="conn conn-off"><i></i>${T.connOff}</div>`;
}

function persist(){
  if(online()) return;   // conectado, la base manda
  save('jobs', state.jobs);
  save('mydumps', state.dumps);
  save('myreqs', state.requests);
  save('lang', state.lang);
  // Bandeja compartida: el panel del admin la lee para mostrar lo que
  // envía el campo. Si ambos corren en el mismo origen, aparece solo.
  save('inbox', {requests:state.requests, dumps:state.dumps});
}

const myJobs = () => state.jobs.filter(j=>j.crew===state.me.crew);

/* ============================================================
   Render
   ============================================================ */
function render(){
  const shell=document.getElementById('shell');
  document.documentElement.lang = state.lang;
  if(!state.me){ shell.innerHTML=renderLogin(); bindLogin(); }
  else{ shell.innerHTML = renderTop()+`<div class="body view-anim">${renderTab()}</div>`+renderTabs(); bindApp(); }
  document.querySelector('.scrim')?.remove();
  if(state.modal){
    const w=document.createElement('div');
    w.innerHTML=renderModal();
    document.body.appendChild(w.firstElementChild);
    bindModal();
  }
  observeReveals();
  initCounters();
}

        </button>

        <b>${T.demoAccounts}:</b><br>

        <b>${T.demoPass}:</b> ${DEMO_PASS}
      </div>`}
    </div>
  </div>`;

function bindLogin(){
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick=()=>{ state.lang=b.dataset.lang; save('lang',state.lang); render(); };
  });
  const go=async()=>{
    const email=document.getElementById('lg-email').value.trim().toLowerCase();
    const pass=document.getElementById('lg-pass').value;
    state.error=null; state.loginEmail=email;

    if(Gamma.online()){
      const btn=document.getElementById('lg-btn');
      btn.disabled=true; btn.textContent=t().syncing;
      try{ await Gamma.signIn(email,pass); }
      catch(e){
        const es = state.lang==='es';
        state.error = /invalid login credentials/i.test(e.message||'')
          ? (es
              ? 'Supabase rechazó ese correo y esa contraseña. Revisa: la contraseña es la que la oficina puso al crear tu usuario, no la de demostración; y si te "invitaron" en vez de crearte el usuario, todavía no tienes contraseña.'
              : 'Supabase rejected that email and password. The password is the one set when your user was created — not the demo one. If you were invited rather than created, you have no password yet.')
          : e.message;
        render(); return;
      }
      // Quién es y qué cuadrilla lidera lo dice la base, no una lista local.
      try{
        const groups = await Gamma.get('groups?select=*');   // RLS: solo la suya
        const g = groups[0];
        if(!g){ state.error=t().noCrew; await Gamma.signOut(); render(); return; }
        state.me = { email, name:(g.leader_name||email), crew:g.id,
                     crewName:g.name, gear:GEAR_FROM_DB[g.equipment_type]||'bucket' };
      }catch(e){ state.error=e.message; render(); return; }
      await refresh();
      startPolling();
      state.tab='jobs'; render();
      return;
    }

    const who=LEADERS.find(l=>l.email===email);
    if(!who || pass!==DEMO_PASS){ state.error=true; render(); return; }
    state.me=who; state.tab='jobs'; render();
  };
  document.getElementById('lg-btn').onclick=go;
  document.getElementById('lg-pass').onkeydown=(e)=>{ if(e.key==='Enter') go(); };
  document.getElementById('lg-email').oninput=(e)=>{ state.loginEmail=e.target.value; };
  document.getElementById('cfg-btn').onclick=()=>{ state.modal={type:'config'}; render(); };
}

/* ============================================================

   ============================================================ */
function bindApp(){
  const T=t();
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick=()=>{ state.lang=b.dataset.lang; save('lang',state.lang); render(); };
  });
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick=async()=>{
      state.tab=b.dataset.tab; render();
      if(online()){ const antes=snapshotSig(state); await refresh();
        if(snapshotSig(state)!==antes) render(); }
    };
  });
  document.getElementById('logout').onclick=async()=>{
    clearInterval(pollTimer);
    if(Gamma.online()) await Gamma.signOut();
    state.me=null; render();
  };

  document.querySelectorAll('[data-start]').forEach(b=>{
    b.onclick=()=>{
      const j=state.jobs.find(x=>x.id===b.dataset.start);
      j.status='progress'; j.startedAt=Date.now();
      toast(T.jobStarted);
      commit(()=>Gamma.rpc('crew_update_order',{p_order:j.id,p_state:'progress'}));
    };
  });
  document.querySelectorAll('[data-done]').forEach(b=>{
    b.onclick=()=>{ state.photo=null; state.modal={type:'done',id:b.dataset.done}; render(); };
  });
  document.querySelectorAll('[data-flag]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'flag',id:b.dataset.flag}; render(); };
  });
  document.querySelectorAll('[data-shot]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'shot',id:b.dataset.shot}; render(); };
  });
  document.querySelectorAll('[data-sketch]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'sketch',id:b.dataset.sketch}; render(); };
  });

  /* --- Vaciado --- */
  document.querySelectorAll('[data-dtype]').forEach(b=>{
    b.onclick=()=>{
      state.dumpType=b.dataset.dtype;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  const dw=document.getElementById('d-where'); if(dw) dw.oninput=(e)=>{ state.dumpDraft.where=e.target.value; };
  const dn=document.getElementById('d-notes'); if(dn) dn.oninput=(e)=>{ state.dumpDraft.notes=e.target.value; };
  const rn=document.getElementById('r-note');  if(rn) rn.oninput=(e)=>{ state.reqDraft.note=e.target.value; };

  document.getElementById('d-send')?.addEventListener('click',()=>{
    const where=document.getElementById('d-where').value.trim();
    if(!where){ toast(T.needWhere,'warn'); return; }
    const d={ id:uid('DR'), crew:state.me.crew, location:where, type:state.dumpType,
              notes:document.getElementById('d-notes').value.trim(), at:Date.now() };
    state.dumpDraft={where:'',notes:''};
    toast(T.dumpDone);
    if(!online()){ state.dumps.unshift(d); persist(); render(); return; }
    commit(()=>Gamma.insert('dump_reports', Map2.dumpToRow(d)));
  });

  /* --- Requerimientos --- */
  document.querySelectorAll('[data-rcat]').forEach(b=>{
    b.onclick=()=>{
      state.reqCat=b.dataset.rcat;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  document.querySelectorAll('[data-rurg]').forEach(b=>{
    b.onclick=()=>{
      state.reqUrg=b.dataset.rurg;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  document.getElementById('r-send')?.addEventListener('click',()=>{
    const note=document.getElementById('r-note').value.trim();
    if(!note){ toast(T.needNote,'warn'); return; }
    const r={ id:uid('RQ'), crew:state.me.crew, cat:state.reqCat,
              urgency:state.reqUrg, note, at:Date.now(), status:'new' };
    state.reqDraft={note:''};
    toast(T.reqDone);
    if(!online()){ state.requests.unshift(r); persist(); render(); return; }
    commit(()=>Gamma.insert('equipment_requests', Map2.reqToRow(r)));
  });
}

function bindModal(){
  const T=t();
  const close=()=>{ state.modal=null; state.photo=null; render(); };
  document.querySelectorAll('[data-close]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target===el) close(); };
  });
  document.querySelectorAll('[data-close-btn]').forEach(b=>{ b.onclick=close; });

  document.getElementById('cf-save')?.addEventListener('click',async()=>{
    const url=document.getElementById('cf-url').value.trim();
    const key=document.getElementById('cf-key').value.trim();
    const problem = urlProblem(url);
    if(problem || key.length<20){
      const es = state.lang==='es';
      state.error =
        problem==='DASHBOARD' ? (es
          ? 'Esa es la dirección del panel de Supabase, no la del proyecto. La que necesitas está en Settings → API → Project URL y se ve como https://abcdefgh.supabase.co'
          : 'That is the Supabase dashboard address, not the project one. You need Settings → API → Project URL, like https://abcdefgh.supabase.co')
      : problem ? (es
          ? 'Esa no parece la URL del proyecto. Debe verse como https://abcdefgh.supabase.co'
          : 'That does not look like the project URL. It should look like https://abcdefgh.supabase.co')
      : (es ? 'La llave anon parece incompleta.' : 'That anon key looks incomplete.');
      state.modal=null; render(); return;
    }
    const btn=document.getElementById('cf-save'); btn.disabled=true; btn.textContent=t().syncing;
    Gamma.configure(url,key);
    try{
      await Gamma.get('groups?select=id&limit=1');
      state.modal=null; render(); toast(t().connOn);
    }catch(e){
      Gamma.disconnect();
      const kind = /invalid path/i.test(e.message||'') ? 'PATH' : connectionHint(e);
      if(kind==='PATH'){
        state.error = state.lang==='es'
          ? 'La dirección llegó a Supabase pero llevaba algo de más. Pega solo https://abcdefgh.supabase.co, sin /rest/v1 al final ni barra.'
          : 'The URL reached Supabase but had something extra. Paste only https://abcdefgh.supabase.co — no /rest/v1, no trailing slash.';
        state.modal=null; render(); return;
      }
      state.error = kind==='SANDBOX'
        ? (state.lang==='es'
            ? 'Este enlace publicado no puede conectarse: corre en un entorno aislado que bloquea toda salida. Descarga el archivo y ábrelo desde el teléfono, o pídele a la oficina el enlace propio.'
            : 'This published link cannot connect: it runs in a sandbox that blocks all outside requests. Open the downloaded file instead, or ask the office for their own link.')
        : (kind==='NET'
            ? (state.lang==='es' ? 'No hubo respuesta de esa dirección. Revisa que esté completa.'
                                 : 'No answer from that URL. Check it is complete.')
            : e.message);
      state.modal=null; render();
    }
  });
  document.getElementById('cf-off')?.addEventListener('click',()=>{
    Gamma.disconnect(); clearInterval(pollTimer);
    state.me=null; state.modal=null; render();
  });

  document.getElementById('ph')?.addEventListener('change',(e)=>{
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ state.photo=r.result; render(); };
    r.readAsDataURL(f);
  });
  document.getElementById('ok-done')?.addEventListener('click',()=>{
    if(!state.photo){ toast(T.needPhoto,'warn'); return; }
    const j=state.jobs.find(x=>x.id===state.modal.id);
    const shot=state.photo;
    j.status='done'; j.photo=shot; j.completedAt=Date.now();
    close(); toast(T.jobDone);
    if(online()) commit(async()=>{
      const url=await Gamma.upload('completion-photos','done.jpg',shot);
      await Gamma.rpc('crew_update_order',{p_order:j.id,p_state:'done',p_photo:url});
    });
  });
  document.getElementById('ok-flag')?.addEventListener('click',()=>{
    const j=state.jobs.find(x=>x.id===state.modal.id);
    j.status='flag'; j.flagReason=document.getElementById('fl-reason').value.trim();
    const reason=j.flagReason;
    close(); toast(T.jobFlagged);
    if(online()) commit(()=>Gamma.rpc('crew_update_order',
      {p_order:j.id,p_state:'flag',p_reason:reason}));
  });
}

/* ---------- Arranque ---------- */
initGlass();
render();
</script>
