<style>/* ============================================================
   GAMMA TREE EXPERTS — sistema de diseño "liquid glass"
   Paleta tomada directamente del logo:
     #811428 burdeos (escudo) · #A89030 oro (cuadrantes)
     #DACFA1 crema (cinta)    · #2D6F4A verde (follaje)
   Compromiso deliberado con un único mundo visual oscuro: el vidrio
   necesita un fondo rico que refractar. Por eso no hay variante clara,
   y todos los fondos se pintan de forma explícita.
   ============================================================ */
:root{
  /* --- Marca --- */
  --burgundy:#811428;
  --burgundy-lit:#A81C36;
  --burgundy-deep:#4A0A17;
  --gold:#A89030;
  --gold-lit:#CDB149;
  --cream:#DACFA1;
  --parchment:#F2ECDC;
  --forest:#2D6F4A;
  --forest-deep:#145839;

  /* --- Suelo: negro con sesgo ciruela, nunca gris puro --- */
  --ground:#170609;
  --ground-2:#250910;

  /* --- Texto: neutros sesgados hacia la crema de la marca --- */
  --text:#F5F0E4;
  --text-dim:#C0B199;
  --text-faint:#8A7A69;

  /* --- Vidrio --- */
  --glass:rgba(255,255,255,.055);
  --glass-2:rgba(255,255,255,.09);
  --glass-3:rgba(255,255,255,.14);
  --glass-brd:rgba(255,255,255,.13);
  --glass-hi:rgba(255,255,255,.40);

  /* --- Semánticos, independientes del acento de marca --- */
  --st-pending:#93826E;
  --st-assigned:#CDB149;
  --st-progress:#E28A2A;
  --st-done:#3E9B63;
  --st-flag:#D8452F;

  /* --- Escala tipográfica --- */
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:17px;
  --t-xl:22px; --t-2xl:30px; --t-3xl:42px;

  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Archivo',system-ui,sans-serif;
  background-color:var(--ground);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* El lienzo ambiental vive detrás de todo y no intercepta el puntero. */
#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;display:block;}
#shell{position:relative;z-index:1;}

h1,h2,h3,.display{
  font-family:'Fraunces',Georgia,serif;
  font-optical-sizing:auto;
  margin:0;
  text-wrap:balance;
  letter-spacing:-.015em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
.num{font-variant-numeric:tabular-nums;}

button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:var(--t-xs);
  text-transform:uppercase;
  letter-spacing:.16em;
  color:var(--text-faint);
}

/* ============================================================
   Vidrio líquido
   ============================================================ */
.glass{
  position:relative;
  isolation:isolate;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(165%);
  -webkit-backdrop-filter:blur(22px) saturate(165%);
  border-radius:var(--r-lg);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    inset 0 -1px 0 rgba(0,0,0,.3),
    0 20px 45px -20px rgba(0,0,0,.8);
}
/* Brillo especular que sigue al cursor. */
.glass::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:-1;
  background:radial-gradient(320px circle at var(--mx,50%) var(--my,0%),
    rgba(255,255,255,.13),transparent 62%);
  opacity:0;transition:opacity .5s var(--ease);
}
.glass:hover::before{opacity:1;}
/* Canto refractado: borde en degradado recortado con máscara. */
.glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,
    rgba(255,255,255,.5),transparent 34%,

function initAmbient(canvas){
  const ctx = canvas.getContext('2d');
  const blobs = [
    { x:.18, y:.20, r:.52, c:[129,20,40],  vx: .000045, vy: .000032 },

      g.addColorStop(0,   `rgba(${b.c[0]},${b.c[1]},${b.c[2]},.42)`);
      g.addColorStop(.55, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},.10)`);
      g.addColorStop(1,   `rgba(${b.c[0]},${b.c[1]},${b.c[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  size();
  addEventListener('resize', () => { size(); if (REDUCED) draw(0); });

  if (REDUCED){ draw(0); return; }
  (function loop(now){ draw(now); raf = requestAnimationFrame(loop); })(0);
  addEventListener('pagehide', () => cancelAnimationFrame(raf));
}

/* --- Revelado al desplazar ------------------------------------------- */
let revealObserver;
function initReveal(){
  revealObserver = new IntersectionObserver((entries) => {
    for (const e of entries){
      if (e.isIntersecting){
        e.target.classList.add('in');
        revealObserver.unobserve(e.target);
      }
    }
  }, { rootMargin: '0px 0px -8% 0px', threshold: .06 });
  observeReveals();
}
function observeReveals(root = document){
  if (!revealObserver) return;
  root.querySelectorAll('.reveal:not(.in)').forEach((el, i) => {
    // El índice escalona la entrada; se reinicia en cada render de vista.
    if (!el.style.getPropertyValue('--i')) el.style.setProperty('--i', i % 12);
    revealObserver.observe(el);
  });
}

/* --- Reflejo especular siguiendo al puntero --------------------------- */
function initSheen(){
  document.addEventListener('pointermove', (ev) => {
    const tile = ev.target.closest?.('.glass');
    if (!tile) return;
    const r = tile.getBoundingClientRect();
    tile.style.setProperty('--mx', ((ev.clientX - r.left) / r.width  * 100) + '%');
    tile.style.setProperty('--my', ((ev.clientY - r.top ) / r.height * 100) + '%');
  }, { passive: true });
}

/* --- Ondas al hacer clic ---------------------------------------------- */
function initRipple(){
  document.addEventListener('pointerdown', (ev) => {
    const el = ev.target.closest?.('.btn, .glass-tile.is-clickable, .chip, .nav-btn, .tab-btn');
    if (!el || REDUCED) return;
    const r = el.getBoundingClientRect();
    const d = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = d + 'px';
    s.style.left = (ev.clientX - r.left - d / 2) + 'px';
    s.style.top  = (ev.clientY - r.top  - d / 2) + 'px';
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    if (getComputedStyle(el).overflow !== 'hidden') s.style.borderRadius = '50%';
    el.appendChild(s);
    setTimeout(() => s.remove(), 640);
  }, { passive: true });
}

/* --- Cuenta ascendente para los KPI ----------------------------------- */
function countUp(el, to, ms = 1100){
  if (REDUCED || to === 0){ el.textContent = to; return; }
  const t0 = performance.now();
  (function step(now){
    const p = Math.min((now - t0) / ms, 1);
    // easeOutExpo: arranca rápido y asienta con suavidad
    const e = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
    el.textContent = Math.round(to * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function initCounters(root = document){
  const io = new IntersectionObserver((entries) => {
    for (const e of entries){
      if (!e.isIntersecting) continue;
      countUp(e.target, Number(e.target.dataset.count || 0));
      io.unobserve(e.target);
    }
  }, { threshold: .4 });
  root.querySelectorAll('[data-count]').forEach((el) => io.observe(el));
}

/* --- Aviso flotante ---------------------------------------------------- */
let toastTimer;
function toast(msg, kind = 'gold'){
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast glass';
  t.style.background = kind === 'gold'
    ? 'linear-gradient(140deg,rgba(205,177,73,.92),rgba(168,144,48,.92))'
    : 'linear-gradient(140deg,rgba(62,155,99,.92),rgba(20,88,57,.92))';
  t.style.color = kind === 'gold' ? '#2A1206' : '#F5F0E4';
  t.innerHTML = `<span aria-hidden="true">${kind === 'gold' ? '✦' : '✓'}</span><span>${msg}</span>`;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* --- Persistencia ------------------------------------------------------
   Los dos prototipos comparten prefijo de clave: si el navegador los sirve
   desde el mismo origen, lo que envía un líder aparece en el panel. Cuando
   no, cada uno conserva su propio estado. La sincronía de verdad es tarea
   del backend en Supabase. */
const STORE_PREFIX = 'gamma.v1.';
function load(key, fallback){
  try{
    const raw = localStorage.getItem(STORE_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  }catch{ return fallback; }
}
function save(key, value){
  try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); }catch{}
}
function clearStore(){
  try{
    Object.keys(localStorage)
      .filter((k) => k.startsWith(STORE_PREFIX))
      .forEach((k) => localStorage.removeItem(k));
  }catch{}
}

function initGlass(){
  const c = document.getElementById('ambient');
  if (c) initAmbient(c);
  initReveal(); initSheen(); initRipple();
}

function uid(p){ return p + '-' + Math.random().toString(36).slice(2,7); }
function iso(offset){ const d=new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); }
function fmtDate(s){
  const d=new Date(s+'T12:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function ago(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Los envíos de la app de líderes viven en claves propias: si el navegador
   sirve ambos prototipos desde el mismo origen, aparecen aquí solos. */
function syncFromCrewApp(){
  const inbox = load('inbox', null);
  if(!inbox) return;
  let added = 0;
  for(const r of (inbox.requests||[])) if(!state.requests.some(x=>x.id===r.id)){ state.requests.unshift(r); added++; }
  for(const d of (inbox.dumps||[]))    if(!state.dumps.some(x=>x.id===d.id))   { state.dumps.unshift(d);    added++; }
  if(added) persist();
}
function persist(){
  save('admin', {crews:state.crews, orders:state.orders, dumps:state.dumps, requests:state.requests});
}

  <aside class="rail glass">
    <div class="rail-brand">
      <img src="${LOGO}" alt="">
      <div><b>Gamma<br>Tree Experts</b><span>Operations</span></div>
    </div>
    <nav>
      ${items.map(([id,label])=>`
        <button class="nav-btn ${state.view===id?'active':''}" data-nav="${id}">
          ${ICONS[id]}<span>${label}</span>
          ${id==='requests'&&n?`<b class="nav-badge num">${n}</b>`:''}
        </button>`).join('')}
    </nav>
    <div class="rail-foot">
      <div class="rail-user">
        <div class="avatar">PG</div>
        <div><b>Paul G.</b><span>paul@gammatree.com</span></div>
      </div>
      <button class="btn btn-glass btn-sm" id="logout" style="width:100%;">${ICONS.out}<span>Sign out</span></button>
    </div>
  </aside>`;
}

function renderView(){
  switch(state.view){
    case 'overview': return viewOverview();
    case 'orders':   return viewOrders();
    case 'schedule': return viewSchedule();
    case 'crews':    return viewCrews();
    case 'dumps':    return viewDumps();
    case 'requests': return viewRequests();
  }
}

/* ---------- Resumen ---------- */
function viewOverview(){
  const today = state.orders.filter(o=>o.date===iso(0));
  const kpis = [
    ['Jobs today',        today.length,                                        'var(--gold-lit)'],
    ['Crews deployed',    new Set(today.filter(o=>o.crew).map(o=>o.crew)).size,'var(--forest)'],
    ['Unassigned',        state.orders.filter(o=>o.status==='pending').length, 'var(--st-pending)'],
    ['Completed today',   today.filter(o=>o.status==='done').length,           'var(--st-done)'],
    ['Open requests',     newRequests(),                                       'var(--st-flag)'],
  ];
  return `
  <div class="page-head reveal">
    <div class="eyebrow">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div>
    <h1>Today at a glance</h1>
    <div class="sub">Everything moving in the field right now.</div>
  </div>

  <div class="kpis">
    ${kpis.map(([k,v,c],i)=>`
      <div class="glass glass-tile kpi reveal" style="--i:${i}">
        <div class="v num" data-count="${v}" style="color:${c}">0</div>
        <div class="k">${k}</div>
        <div class="kpi-bar" style="color:${c}"></div>
      </div>`).join('')}
  </div>

  <div class="cols">
    <div class="glass glass-tile reveal">
      <div class="tile-head"><h2>Live map</h2><span class="eyebrow">Mapbox next</span></div>
      <div class="map">
        ${state.crews.map(c=>{
          const busy = state.orders.some(o=>o.crew===c.id && o.status==='progress');
          return `<div class="pin ${busy?'busy':''}" style="left:${c.x}%;top:${c.y}%"><i></i><b>${esc(c.name)}</b></div>`;
        }).join('')}
        <div class="map-note">Simulated positions — wired to location_pings in Phase 6</div>
      </div>
    </div>

    <div class="glass glass-tile reveal">
      <div class="tile-head"><h2>Today's orders</h2><span class="eyebrow">${today.length} total</span></div>
      <div class="stack">
        ${today.length? today.map(o=>orderRow(o)).join('') : emptyState('Nothing scheduled','No work orders on the board for today.')}
      </div>
    </div>
  </div>`;
}

function orderRow(o){
  return `
  <div class="glass glass-tile is-clickable row-card" data-order="${o.id}">
    <div class="row-top">
      <h3>${esc(o.address)}</h3>
      <span class="pill pill-${o.status}">${STATUS[o.status]}</span>
    </div>
    <div class="meta">
      <span>${JOBS[o.job]}</span><span class="dot">·</span>
      <span>${GEAR[o.gear]}</span><span class="dot">·</span>
      <span>${esc(crewName(o.crew))}</span>
      ${o.sketch?'<span class="dot">·</span><span>&#9639; sketch</span>':''}
    </div>
  </div>`;
}

/* ---------- Órdenes de trabajo ---------- */

  const counts = (s)=> s==='all'? state.orders.length : state.orders.filter(o=>o.status===s).length;
  return `
  <div class="page-head head-row reveal">
    <div>
      <div class="eyebrow">Dispatch</div>
      <h1>Work orders</h1>
      <div class="sub">${state.orders.length} on the board.</div>
    </div>
    <button class="btn btn-primary" id="new-order">${ICONS.plus}<span>New order</span></button>
  </div>

  <div class="filters reveal">
    ${[['all','All'],...Object.entries(STATUS)].map(([k,v])=>`
      <button class="chip ${state.filter===k?'is-on':''}" data-filter="${k}">${v}<b class="num" style="opacity:.6">${counts(k)}</b></button>`).join('')}
  </div>

  <div class="stack">
    ${list.length? list.map((o,i)=>`
      <div class="glass glass-tile row-card reveal" style="--i:${i}">
        <div class="row-top">
          <h3>${esc(o.address)}</h3>
          <span class="pill pill-${o.status}">${STATUS[o.status]}</span>
        </div>
        <div class="meta">
          <span>${fmtDate(o.date)}</span><span class="dot">·</span>
          <span>${JOBS[o.job]}</span><span class="dot">·</span>
          <span>${GEAR[o.gear]}</span>

        ${o.notes?`<div class="note-box">${esc(o.notes)}</div>`:''}
        ${o.flagReason?`<div class="note-box" style="border-left:3px solid var(--st-flag)"><b>Crew flagged:</b> ${esc(o.flagReason)}</div>`:''}
        <div class="crew-line" style="margin-top:13px;border-top-color:rgba(255,255,255,.09)">
          <span>Crew</span>
          <select class="input" data-assign="${o.id}" style="width:auto;min-width:190px;padding:8px 38px 8px 12px;font-size:12.5px;">
            <option value="">— Unassigned —</option>
            ${state.crews.map(c=>`<option value="${c.id}" ${o.crew===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}

/* ---------- Cronograma ---------- */
function viewSchedule(){
  return `
  <div class="page-head reveal">
    <div class="eyebrow">Next 7 days</div>
    <h1>Schedule</h1>
    <div class="sub">Click any job to open it.</div>
  </div>
  <div class="week">
    ${Array.from({length:7},(_,i)=>{
      const d=iso(i), jobs=state.orders.filter(o=>o.date===d);
      const dt=new Date(d+'T12:00:00');
      return `
      <div class="glass glass-tile day reveal ${i===0?'today':''}" style="--i:${i}">
        <div class="day-h"><b>${DAYS[(dt.getDay()+6)%7]}</b><i>${dt.getDate()}</i></div>
        ${jobs.map(o=>`
          <div class="cal-chip" data-order="${o.id}">
            <b>${esc(o.address.split(',')[0])}</b>

          </div>`).join('') || '<div class="eyebrow" style="opacity:.5">Clear</div>'}

  </div>`;
}

/* ---------- Cuadrillas (habilidades editables) ---------- */

    ${state.crews.map((c,i)=>{

      return `
      <div class="glass glass-tile reveal" style="--i:${i}">
        <div class="crew-top">
          <div class="avatar">${initials(c.leader)}</div>
          <div style="min-width:0">
            <b>${esc(c.name)}</b>
            <span>${esc(c.email)}</span>
          </div>
        </div>

        <div class="crew-line" style="border-top:none;padding-top:0">
          <span>Equipment</span>
          <select class="input" data-gear="${c.id}" style="width:auto;padding:7px 34px 7px 11px;font-size:12.5px;">
            ${Object.entries(GEAR).map(([k,v])=>`<option value="${k}" ${c.gear===k?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="crew-line">
          <span>Members</span>
          <div class="stepper">
            <button data-members="${c.id}" data-delta="-1" aria-label="Remove member">&minus;</button>
            <b class="num">${c.members}</b>
            <button data-members="${c.id}" data-delta="1" aria-label="Add member">+</button>
          </div>
        </div>
        <div class="crew-line">
          <span>Open jobs</span><b class="num">${open}</b>
        </div>

        <div class="skills-box">
          <span class="eyebrow">Skills</span>
          <div class="skills-list">
            ${c.skills.map(s=>`
              <span class="chip is-on chip-anim">${SKILLS[s]}

              </span>`).join('')}
            ${spare.length?`<button class="chip" data-addskill="${c.id}">+ Add skill</button>`
              :'<span class="eyebrow" style="opacity:.55">All skills assigned</span>'}

        </div>
      </div>`;

}

/* ---------- Vaciados ---------- */
function viewDumps(){
  const list=[...state.dumps].sort((a,b)=>b.at-a.at);
  return `
  <div class="page-head reveal">
    <div class="eyebrow">Reported from the field</div>
    <h1>Dump reports</h1>
    <div class="sub">Crews log every load they drop from the app.</div>
  </div>
  <div class="stack">
    ${list.length? list.map((d,i)=>`
      <div class="glass glass-tile row-card reveal" style="--i:${i}">
        <div class="row-top">
          <h3>${esc(d.location)}</h3>
          <span class="pill ${d.type==='chips'?'pill-done':'pill-assigned'}">${d.type}</span>
        </div>
        <div class="meta">
          <span>${esc(crewName(d.crew))}</span><span class="dot">·</span>

        ${d.notes?`<div class="note-box">${esc(d.notes)}</div>`:''}

/* ---------- Requerimientos ---------- */
function viewRequests(){
  const order={new:0,ordered:1,resolved:2};
  const list=[...state.requests].sort((a,b)=> order[a.status]-order[b.status] || b.at-a.at);
  return `
  <div class="page-head reveal">
    <div class="eyebrow">From the crews</div>
    <h1>Requests</h1>
    <div class="sub">Rope, tool damage, safety gear — everything the field asks for.</div>
  </div>
  <div class="stack">
    ${list.length? list.map((r,i)=>`
      <div class="glass glass-tile req-card u-${r.urgency} reveal" style="--i:${i}">
        <div class="row-top">
          <h3>${REQ_CAT[r.cat]} &middot; ${esc(crewName(r.crew))}</h3>
          <span class="pill ${r.status==='new'?'pill-flag':r.status==='ordered'?'pill-progress':'pill-done'}">${REQ_STATUS[r.status]}</span>
        </div>
        <div class="meta">
          <span>${r.urgency==='urgent'?'&#9650; Urgent':r.urgency==='normal'?'Normal':'Low'}</span>
          <span class="dot">·</span><span>${ago(r.at)}</span>
        </div>
        <div class="note-box">${esc(r.note)}</div>
        <div class="req-actions">
          ${r.status==='new'?`<button class="btn btn-gold btn-sm" data-req="${r.id}" data-to="ordered">Mark ordered</button>`:''}
          ${r.status!=='resolved'?`<button class="btn btn-glass btn-sm" data-req="${r.id}" data-to="resolved">Mark resolved</button>`:''}
          ${r.status==='resolved'?`<button class="btn btn-glass btn-sm" data-req="${r.id}" data-to="new">Reopen</button>`:''}
        </div>
      </div>`).join('')
    : emptyState('Nothing pending','Requests submitted from the crew app land here.')}
  </div>`;
}

function emptyState(title,sub){
  return `<div class="glass empty"><b>${title}</b>${sub}</div>`;
}

/* ---------- Modales ---------- */

  if(m.type==='addSkill')  return modalAddSkill(crewById(m.id));
  return '';
}

  <div class="scrim" data-close>
    <div class="modal glass">
      <div class="modal-head">
        <div><div class="eyebrow">Dispatch</div><h2 style="font-size:var(--t-xl)">New work order</h2></div>
        <button class="icon-btn" data-close aria-label="Close">&times;</button>
      </div>

/* ============================================================
   Eventos
   ============================================================ */
function bindShell(){
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick=()=>{ state.view=b.dataset.nav; state.filter='all'; render(); };
  });
  document.getElementById('logout').onclick=()=>{ state.loggedIn=false; state.view='overview'; render(); };

  document.querySelectorAll('[data-order]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target.closest('select')) return;
      state.modal={type:'viewOrder',id:el.dataset.order}; render(); };
  });
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.onclick=()=>{ state.filter=b.dataset.filter; render(); };
  });
  document.getElementById('new-order')?.addEventListener('click',()=>{
    state.modal={type:'newOrder'}; render();
  });
  document.querySelectorAll('[data-assign]').forEach(sel=>{
    sel.onchange=()=>{
      const o=state.orders.find(x=>x.id===sel.dataset.assign);
      o.crew=sel.value||null;
      if(o.crew && (o.status==='pending'||o.status==='flag')) o.status='assigned';
      else if(!o.crew && o.status==='assigned') o.status='pending';
      persist(); toast(o.crew?`Assigned to ${crewName(o.crew)}`:'Order unassigned'); render();
    };
  });

  /* --- Cuadrillas: habilidades, equipo y tamaño --- */
  document.querySelectorAll('[data-rmskill]').forEach(b=>{
    b.onclick=(e)=>{
      e.stopPropagation();
      const c=crewById(b.dataset.rmskill);
      c.skills=c.skills.filter(s=>s!==b.dataset.skill);
      persist(); toast(`${SKILLS[b.dataset.skill]} removed from ${c.name}`); render();
    };
  });
  document.querySelectorAll('[data-addskill]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'addSkill',id:b.dataset.addskill}; render(); };
  });
  document.querySelectorAll('[data-gear]').forEach(sel=>{
    sel.onchange=()=>{ crewById(sel.dataset.gear).gear=sel.value; persist(); toast('Equipment updated'); render(); };
  });
  document.querySelectorAll('[data-members]').forEach(b=>{
    b.onclick=()=>{
      const c=crewById(b.dataset.members);
      c.members=Math.max(1,Math.min(12,c.members+Number(b.dataset.delta)));
      persist(); render();
    };
  });

  /* --- Requerimientos --- */
  document.querySelectorAll('[data-req]').forEach(b=>{
    b.onclick=()=>{
      const r=state.requests.find(x=>x.id===b.dataset.req);
      r.status=b.dataset.to;
      persist(); toast(`Request marked ${REQ_STATUS[r.status].toLowerCase()}`, r.status==='resolved'?'green':'gold'); render();
    };
  });
}

function bindModal(){
  document.querySelectorAll('[data-close]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target===el){ state.modal=null; render(); } };
  });
  document.getElementById('f-save')?.addEventListener('click',()=>{
    const addr=document.getElementById('f-addr').value.trim();
    if(!addr){ toast('An address is required'); return; }
    const crew=document.getElementById('f-crew').value||null;
    state.orders.unshift({
      id:uid('WO'), address:addr,
      date:document.getElementById('f-date').value,
      job:document.getElementById('f-job').value,
      gear:document.getElementById('f-gear').value,
      notes:document.getElementById('f-notes').value.trim(),
      status:crew?'assigned':'pending', crew, sketch:null,
    });
    persist(); state.modal=null; state.view='orders'; render();
    toast('Work order created','green');
  });
  document.querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick=()=>{
      const c=crewById(state.modal.id);
      c.skills.push(b.dataset.pick);
      persist(); state.modal=null; render();
      toast(`${SKILLS[b.dataset.pick]} added to ${c.name}`,'green');
    };
  });
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){ state.modal=null; render(); document.removeEventListener('keydown',esc); }
  });
}

/* ---------- Arranque ---------- */
initGlass();
syncFromCrewApp();
addEventListener('storage',(e)=>{ if(e.key&&e.key.includes('inbox')){ syncFromCrewApp(); render(); } });
render();
</script>
