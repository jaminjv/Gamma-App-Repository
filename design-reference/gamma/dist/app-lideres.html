<style>/* ============================================================
   GAMMA TREE EXPERTS — sistema de diseño "liquid glass", versión clara
     Verde #06402B dominante · vino tinto secundario · oro del logo terciario
   Una sola familia tipográfica, Google Sans Flex, variable: los roles se
   distinguen por grosor y espaciado, no por familia.
   Compromiso deliberado con un único mundo visual claro; todos los fondos
   se pintan de forma explícita para no heredar el del visor.
   ============================================================ */
:root{
  /* --- Verde dominante --- */
  --green:#06402B;
  --green-lit:#0A5C3E;
  --green-deep:#032418;
  --green-tint:#E7EFEA;
  --green-tint-2:#D5E3DB;

  /* --- Vino tinto: secundario --- */
  --wine:#811428;
  --wine-lit:#A81C36;
  --wine-tint:#F8E9EC;

  /* --- Oro del logo: terciario --- */
  --gold:#A89030;
  --gold-deep:#786620;
  --gold-tint:#F5F1DE;

  /* --- Suelo claro: gris sesgado al verde, ni blanco puro ni gris neutro --- */
  --paper:#F1F5F2;
  --paper-2:#E6ECE8;
  --white:#FFFFFF;

  /* --- Texto: casi negro con sesgo verde --- */
  --text:#0E241B;
  --text-dim:#456056;
  --text-faint:#7B9187;

  /* --- Vidrio sobre fondo claro --- */
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(255,255,255,.80);
  --glass-3:rgba(255,255,255,.94);
  --glass-brd:rgba(6,64,43,.11);
  --glass-hi:rgba(255,255,255,.95);
  --shadow:0 14px 34px -16px rgba(6,64,43,.26);
  --shadow-lift:0 26px 50px -20px rgba(6,64,43,.32);

  /* --- Semánticos, independientes de la marca salvo done/flag --- */
  --st-pending:#7B9187;
  --st-assigned:#8A7420;
  --st-progress:#B85C10;
  --st-done:#06402B;
  --st-flag:#811428;

  /* --- Escala tipográfica --- */
  --t-xs:11px; --t-sm:12.5px; --t-md:14px; --t-lg:17px;
  --t-xl:22px; --t-2xl:30px; --t-3xl:42px;

  --r-sm:12px; --r-md:18px; --r-lg:24px; --r-xl:32px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:'Google Sans Flex','Google Sans',system-ui,sans-serif;
  font-optical-sizing:auto;
  background-color:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

#ambient{position:fixed;inset:0;z-index:0;pointer-events:none;display:block;}
#shell{position:relative;z-index:1;}

/* Una sola familia: la jerarquía la carga el grosor. */
h1,h2,h3,.display{
  font-family:inherit;
  font-weight:700;
  margin:0;
  text-wrap:balance;
  letter-spacing:-.022em;
  color:var(--green);
}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em;}
.num{font-variant-numeric:tabular-nums;}

button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}

.eyebrow{
  font-size:var(--t-xs);
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.15em;
  color:var(--text-faint);
}

/* ============================================================
   Vidrio líquido sobre claro
   ============================================================ */
.glass{
  position:relative;
  isolation:isolate;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-radius:var(--r-lg);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    inset 0 0 0 1px var(--glass-brd),
    var(--shadow);
}
/* Sobre vidrio claro el reflejo se lee como un "mojado" que aclara la
   superficie hacia el cursor, no como un brillo blanco sobre oscuro. */
.glass::before{
  content:'';position:absolute;inset:0;border-radius:inherit;
  pointer-events:none;z-index:-1;
  background:radial-gradient(300px circle at var(--mx,50%) var(--my,0%),
    rgba(255,255,255,.95),transparent 62%);
  opacity:0;transition:opacity .5s var(--ease);
}
.glass:hover::before{opacity:1;}
/* Canto refractado: luz arriba-izquierda, sombra verde abajo-derecha. */
.glass::after{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  pointer-events:none;z-index:-1;
  background:linear-gradient(150deg,
    rgba(255,255,255,1),transparent 34%,
    transparent 64%,rgba(6,64,43,.16));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}

.glass-tile{
  padding:22px;
  transition:transform .5s var(--ease),background .4s var(--ease),
             box-shadow .5s var(--ease);
}
.glass-tile:hover{
  transform:translateY(-3px);
  background:var(--glass-2);
  box-shadow:
    inset 0 1px 0 var(--glass-hi),
    inset 0 0 0 1px var(--glass-brd),
    var(--shadow-lift);
}
.glass-tile.is-clickable{cursor:pointer;}
.glass-tile.is-clickable:active{transform:translateY(-1px) scale(.988);}

/* ============================================================
   Movimiento
   ============================================================ */
.reveal{
  opacity:0;
  transform:translateY(22px);
  filter:blur(5px);
  transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease);
  transition-delay:calc(var(--i,0) * 62ms);
}
.reveal.in{opacity:1;transform:none;filter:none;}

@keyframes ripple{to{transform:scale(2.6);opacity:0;}}
.ripple{
  position:absolute;border-radius:50%;pointer-events:none;
  /* Sobre claro la onda tiene que ser verde: una blanca no se vería. */
  background:radial-gradient(circle,rgba(6,64,43,.22),rgba(6,64,43,0) 70%);
  transform:scale(0);animation:ripple .62s var(--ease) forwards;
}

<script>
/* ============================================================
   Capa de interacción compartida.
   Todo respeta prefers-reduced-motion.
   ============================================================ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* --- Fondo ambiental -------------------------------------------------
   Manchas de color a la deriva que le dan al vidrio algo que refractar.
   En canvas y no en SVG porque es puramente decorativo y barato de animar. */
function initAmbient(canvas){
  const ctx = canvas.getContext('2d');
  // Lavados suaves sobre papel claro: verde dominante, vino y oro de apoyo.
  // Las opacidades son bajas a propósito — sobre claro, poco tiñe mucho.
  const blobs = [
    { x:.18, y:.20, r:.55, c:[6,64,43],    a:.21, vx: .000045, vy: .000032 },
    { x:.82, y:.28, r:.46, c:[168,144,48], a:.15, vx:-.000038, vy: .000047 },
    { x:.58, y:.86, r:.52, c:[10,92,62],   a:.19, vx: .000030, vy:-.000041 },
    { x:.08, y:.76, r:.36, c:[129,20,40],  a:.10, vx: .000052, vy:-.000028 },
  ];
  let w, h, raf;

  function size(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width  = Math.floor(innerWidth  * dpr);
    h = canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }

  function draw(t){
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#F1F5F2';
    ctx.fillRect(0, 0, w, h);
    // Sobre claro los lavados se componen en 'multiply': 'lighter' los
    // volvería blancos y desaparecerían.
    ctx.globalCompositeOperation = 'multiply';

    for (const b of blobs){
      // Deriva lenta en trayectoria de Lissajous; se mantiene dentro del lienzo.
      const px = (b.x + Math.sin(t * b.vx) * .12) * w;
      const py = (b.y + Math.cos(t * b.vy) * .12) * h;
      const pr = b.r * Math.max(w, h) * .55;
      const g = ctx.createRadialGradient(px, py, 0, px, py, pr);
      g.addColorStop(0,   `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a})`);
      g.addColorStop(.55, `rgba(${b.c[0]},${b.c[1]},${b.c[2]},${b.a * .28})`);
      g.addColorStop(1,   `rgba(${b.c[0]},${b.c[1]},${b.c[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  addEventListener('resize', () => { size(); if (REDUCED) draw(0); });

  if (REDUCED){ draw(0); return; }

let revealObserver;

  if (!revealObserver) return;

    const r = tile.getBoundingClientRect();

    tile.style.setProperty('--my', ((ev.clientY - r.top ) / r.height * 100) + '%');

/* --- Ondas al hacer clic ---------------------------------------------- */

function countUp(el, to, ms = 1100){

    }
  }, { threshold: .4 });
  root.querySelectorAll('[data-count]').forEach((el) => io.observe(el));
}

/* --- Aviso flotante ---------------------------------------------------- */
let toastTimer;
// Por defecto el aviso confirma: la mayoría de las llamadas son
// confirmaciones. El vino tinto queda solo para 'warn' — una validación que
// no pasó — para que el color signifique siempre lo mismo.
function toast(msg, kind = 'ok'){
  document.querySelector('.toast')?.remove();
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className = 'toast glass';
  const warn = kind === 'warn';
  t.style.background = warn
    ? 'linear-gradient(140deg,#A81C36,#811428)'
    : 'linear-gradient(140deg,#0A5C3E,#06402B)';
  t.style.boxShadow = '0 16px 34px -14px rgba(6,64,43,.5)';
  t.innerHTML = `<span aria-hidden="true">${warn ? '!' : '✓'}</span><span>${msg}</span>`;
  t.setAttribute('role', 'status');
  document.body.appendChild(t);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* --- Persistencia ------------------------------------------------------
   Los dos prototipos comparten prefijo de clave: si el navegador los sirve
   desde el mismo origen, lo que envía un líder aparece en el panel. Cuando
   no, cada uno conserva su propio estado. La sincronía de verdad es tarea
   del backend en Supabase. */
const STORE_PREFIX = 'gamma.v1.';
function load(key, fallback){
  try{
    const raw = localStorage.getItem(STORE_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  }catch{ return fallback; }
}
// Devuelve false si no pudo guardar (cuota llena), para que quien llama
// avise en vez de perder los datos en silencio.
function save(key, value){
  try{ localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value)); return true; }
  catch{ return false; }
}

/* --- Lectura de imágenes ----------------------------------------------
   Una foto de teléfono ronda los 4 MB; en base64 sube a ~5.5 MB y por sí
   sola agota la cuota de localStorage. Se reescala en un canvas antes de
   guardarla, que además hace la interfaz mucho más ágil. */
function readImage(file, maxPx = 1200, quality = .78){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width  = Math.round(img.width  * scale);
        c.height = Math.round(img.height * scale);
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function clearStore(){
  try{
    Object.keys(localStorage)
      .filter((k) => k.startsWith(STORE_PREFIX))
      .forEach((k) => localStorage.removeItem(k));
  }catch{}
}

function initGlass(){
  const c = document.getElementById('ambient');
  if (c) initAmbient(c);
  initReveal(); initSheen(); initRipple();
}

/* ============================================================
   GAMMA — capa de datos
   Dos modos, misma interfaz para las dos aplicaciones:
     · local  — sin configurar: todo vive en localStorage (modo demostración)
     · nube   — configurado: habla con Supabase por REST, y entonces los
                datos sí viajan entre la oficina y los teléfonos
   Se elige solo según haya o no configuración guardada.

   Aviso: dentro de un artifact publicado el modo nube no puede funcionar,
   porque ese entorno bloquea toda petición a hosts externos. Sirve al
   abrir el archivo localmente o al servirlo desde tu propio hosting.
   ============================================================ */
const Gamma = {
  cfg: load('cfg', null),          // {url, key}
  session: load('session', null),  // {access_token, refresh_token, user}

  online(){ return !!(this.cfg && this.cfg.url && this.cfg.key); },
  signedIn(){ return !!(this.session && this.session.access_token); },

  configure(url, key){
    this.cfg = { url: normalizeUrl(url), key: String(key).trim() };
    save('cfg', this.cfg);
  },
  disconnect(){
    this.cfg = null; this.session = null;
    save('cfg', null); save('session', null);
  },

  headers(extra){
    const h = {
      apikey: this.cfg.key,
      Authorization: 'Bearer ' + (this.session?.access_token || this.cfg.key),
      'Content-Type': 'application/json',
      ...extra,
    };
    return h;
  },

  /* --- Autenticación --------------------------------------------------- */
  async signIn(email, password){
    const r = await fetch(`${this.cfg.url}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const body = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(body.error_description || body.msg || body.message || 'No se pudo iniciar sesión');
    this.session = body; save('session', body);
    return body.user;
  },
  async signOut(){
    try{
      if(this.session) await fetch(`${this.cfg.url}/auth/v1/logout`, {
        method:'POST', headers:this.headers(),
      });
    }catch{}
    this.session = null; save('session', null);
  },
  // Renueva el token cuando caduca; sin esto la sesión muere a la hora.
  async refresh(){
    if(!this.session?.refresh_token) return false;
    const r = await fetch(`${this.cfg.url}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST',
      headers:{ apikey:this.cfg.key, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token:this.session.refresh_token }),
    });
    if(!r.ok){ this.session=null; save('session',null); return false; }
    this.session = await r.json(); save('session', this.session);
    return true;
  },

  /* --- REST ------------------------------------------------------------ */
  async rest(path, opts = {}, retry = true){
    const r = await fetch(`${this.cfg.url}/rest/v1/${path}`, {
      ...opts,
      headers: this.headers(opts.headers),
    });
    if(r.status === 401 && retry && await this.refresh()) return this.rest(path, opts, false);
    if(!r.ok){
      const e = await r.json().catch(()=>({}));
      throw new Error(e.message || e.hint || `${r.status} en ${path}`);
    }
    return r.status === 204 ? null : r.json();
  },
  get(path){ return this.rest(path); },
  insert(table, row){
    return this.rest(table, {
      method:'POST',
      headers:{ Prefer:'return=representation' },
      body: JSON.stringify(row),
    });
  },
  patch(table, id, changes){
    return this.rest(`${table}?id=eq.${id}`, {
      method:'PATCH',
      headers:{ Prefer:'return=representation' },
      body: JSON.stringify(changes),
    });
  },
  remove(table, query){ return this.rest(`${table}?${query}`, { method:'DELETE' }); },
  rpc(fn, args){
    return this.rest(`rpc/${fn}`, { method:'POST', body: JSON.stringify(args) });
  },

  /* --- Storage ---------------------------------------------------------
     Las fotos van al bucket y a la fila solo su URL: guardar el data URI
     en una columna hincha cada consulta con megabytes de imagen. */
  async upload(bucket, name, dataUrl){
    const blob = await (await fetch(dataUrl)).blob();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,7)}-${name}`;
    const r = await fetch(`${this.cfg.url}/storage/v1/object/${bucket}/${path}`, {
      method:'POST',
      headers:{
        apikey:this.cfg.key,
        Authorization:'Bearer ' + (this.session?.access_token || this.cfg.key),
        'Content-Type': blob.type || 'image/jpeg',
      },
      body: blob,
    });
    if(!r.ok) throw new Error('No se pudo subir la imagen');
    return `${this.cfg.url}/storage/v1/object/public/${bucket}/${path}`;
  },
};

/* Normaliza lo que sea que hayan pegado.
   Copiar del panel de Supabase arrastra espacios y saltos de línea, y mucha
   gente pega la URL ya con el sufijo de la API. Cualquiera de esas tres cosas
   produce una ruta con doble barra o duplicada, y Supabase responde
   "Invalid path specified in request URL", que no dice dónde mirar. */
function normalizeUrl(raw){
  let u = String(raw).trim();
  u = u.replace(/^[<"'\s]+|[>"'\s]+$/g, '');       // comillas y espacios pegados
  u = u.replace(/\/(rest|auth|storage)\/v\d+\/?.*$/i, '');  // sufijo de la API
  u = u.replace(/\/+$/, '');                        // barras finales
  if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

/* Revisa la forma de la URL antes de gastar una petición, y devuelve el
   motivo concreto cuando no puede ser la del proyecto. */
function urlProblem(raw){
  const u = normalizeUrl(raw);
  if(!u) return 'EMPTY';
  let host;
  try{ host = new URL(u).hostname; }catch{ return 'MALFORMED'; }
  if(/supabase\.(com|green)$/i.test(host)) return 'DASHBOARD';   // el panel, no el proyecto
  if(/^(localhost|127\.|\[)/.test(host)) return null;            // desarrollo local
  if(!/supabase\.(co|in)$/i.test(host) && !host.includes('.')) return 'MALFORMED';
  return null;
}

/* --- Repintado seguro ------------------------------------------------
   Volver a dibujar la pantalla cada 8 segundos tiene dos efectos que nadie
   pidió: borra lo que la persona está escribiendo en un formulario que no
   es modal, y reproduce otra vez todas las animaciones de entrada, de modo
   que la aplicación parece recargarse sola aunque no haya cambiado nada. */

// ¿El cursor está dentro de un campo? Entonces no se toca la pantalla.
function isTyping(){
  const el = document.activeElement;
  return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
                  el.tagName === 'SELECT' || el.isContentEditable);
}

// Firma barata de lo que vino del servidor: si no cambió, no se repinta.
function snapshotSig(st){
  return JSON.stringify([
    (st.orders   || []).map(o => [o.id, o.status, o.date, o.crew, o.dropWire]),
    (st.jobs     || []).map(j => [j.id, j.status, j.date]),
    (st.dumps    || []).map(d => d.id),
    (st.requests || []).map(r => [r.id, r.status]),
    (st.crews    || []).map(c => [c.id, c.members, c.gear, (c.skills || []).join()]),
  ]);
}

/* Diagnóstico de conexión.
   Un fallo de red y una URL mal escrita se ven igual desde JavaScript, pero
   el remedio es opuesto: decirle a alguien "revisa la URL" cuando lo que
   pasa es que el entorno bloquea toda salida lo manda a buscar donde no es. */
function connectionHint(err){
  const blocked = /failed to fetch|networkerror|load failed|not allowed/i.test(err?.message || '');
  const sandboxed = (() => { try { return window.self !== window.top; } catch { return true; } })();
  if(blocked && sandboxed) return 'SANDBOX';
  if(blocked) return 'NET';
  return null;
}

const GEAR_TO_DB   = { bucket:'bucket', climbing:'climbing', both:'ambos' };
const GEAR_FROM_DB = { bucket:'bucket', climbing:'climbing', ambos:'both' };

// La posición en el mapa es decorativa y no está en la base: se deriva del
// id para que cada cuadrilla caiga siempre en el mismo punto.
function pinFor(id){
  let h = 0;
  for(const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return { x: 15 + (h % 70), y: 20 + ((h >> 8) % 60) };
}

/* ============================================================
   Lectura completa. RLS decide qué ve cada quien: el admin lo ve todo y
   el líder solo lo de su cuadrilla, sin que el cliente filtre nada.
   ============================================================ */
async function pullAll(){
  const [groups, skills, orders, photos, dumps, requests] = await Promise.all([
    Gamma.get('groups?select=*&order=name.asc'),
    Gamma.get('group_skills?select=*'),
    Gamma.get('work_orders?select=*&order=scheduled_date.asc,created_at.desc'),
    Gamma.get('work_order_photos?select=*'),
    Gamma.get('dump_reports?select=*&order=reported_at.desc'),
    Gamma.get('equipment_requests?select=*&order=created_at.desc'),
  ]);
  return {
    crews:    groups.map(g => Map2.crewFromRow(g, skills)),
    orders:   orders.map(o => Map2.orderFromRow(o, photos)),
    dumps:    dumps.map(Map2.dumpFromRow),
    requests: requests.map(Map2.reqFromRow),
  };
}

/* Reconcilia las habilidades de una cuadrilla: la base guarda una fila por
   habilidad, así que se inserta lo que falta y se borra lo que sobra. */
async function saveSkills(crewId, before, after){
  const add = after.filter(s => !before.includes(s));
  const del = before.filter(s => !after.includes(s));
  if(add.length) await Gamma.insert('group_skills', add.map(s => ({ group_id:crewId, skill:s })));
  for(const s of del) await Gamma.remove('group_skills', `group_id=eq.${crewId}&skill=eq.${s}`);
}

function iso(o){ const d=new Date(); d.setDate(d.getDate()+o); return d.toISOString().slice(0,10); }
function esc(s){
  return String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(s){

  if(m<60) return m+'m';
  const h=Math.floor(m/60); if(h<24) return h+'h';
  return Math.floor(h/24)+'d';
}

async function refresh(){
  if(!online()) return;
  try{
    const data = await pullAll();          // RLS deja pasar solo su cuadrilla
    state.jobs = data.orders;
    state.dumps = data.dumps;
    state.requests = data.requests;
  }catch(e){ toast(e.message,'warn'); }
}

async function commit(cloudFn){
  if(!online()){ persist(); render(); return; }
  state.busy = true;
  try{ await cloudFn(); await refresh(); }
  catch(e){ toast(e.message,'warn'); await refresh(); }
  state.busy = false;
  render();
}

function startPolling(){
  clearInterval(pollTimer);
  if(!online()) return;
  pollTimer = setInterval(async ()=>{
    // No interrumpir una ventana abierta, una escritura en curso ni a
    // alguien tecleando en un formulario.
    if(state.modal || state.busy || isTyping()) return;
    const antes = snapshotSig(state);
    await refresh();
    if(snapshotSig(state) !== antes) render();   // solo si de verdad cambió
  }, 8000);
}

function connBadge(){
  const T=t();
  return online() || Gamma.online()
    ? `<div class="conn conn-on"><i></i>${T.connOn}</div>`
    : `<div class="conn conn-off"><i></i>${T.connOff}</div>`;
}

function persist(){
  if(online()) return;   // conectado, la base manda
  save('jobs', state.jobs);
  save('mydumps', state.dumps);
  save('myreqs', state.requests);
  save('lang', state.lang);
  // Bandeja compartida: el panel del admin la lee para mostrar lo que
  // envía el campo. Si ambos corren en el mismo origen, aparece solo.
  save('inbox', {requests:state.requests, dumps:state.dumps});
}

  else{ shell.innerHTML = renderTop()+`<div class="body view-anim">${renderTab()}</div>`+renderTabs(); bindApp(); }

}

function bindLogin(){
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick=()=>{ state.lang=b.dataset.lang; save('lang',state.lang); render(); };
  });
  const go=async()=>{
    const email=document.getElementById('lg-email').value.trim().toLowerCase();
    const pass=document.getElementById('lg-pass').value;
    state.error=null; state.loginEmail=email;

    if(Gamma.online()){
      const btn=document.getElementById('lg-btn');
      btn.disabled=true; btn.textContent=t().syncing;
      try{ await Gamma.signIn(email,pass); }
      catch(e){
        const es = state.lang==='es';
        state.error = /invalid login credentials/i.test(e.message||'')
          ? (es
              ? 'Supabase rechazó ese correo y esa contraseña. Revisa: la contraseña es la que la oficina puso al crear tu usuario, no la de demostración; y si te "invitaron" en vez de crearte el usuario, todavía no tienes contraseña.'
              : 'Supabase rejected that email and password. The password is the one set when your user was created — not the demo one. If you were invited rather than created, you have no password yet.')
          : e.message;
        render(); return;
      }
      // Quién es y qué cuadrilla lidera lo dice la base, no una lista local.
      try{
        const groups = await Gamma.get('groups?select=*');   // RLS: solo la suya
        const g = groups[0];
        if(!g){ state.error=t().noCrew; await Gamma.signOut(); render(); return; }
        state.me = { email, name:(g.leader_name||email), crew:g.id,
                     crewName:g.name, gear:GEAR_FROM_DB[g.equipment_type]||'bucket' };
      }catch(e){ state.error=e.message; render(); return; }
      await refresh();
      startPolling();
      state.tab='jobs'; render();
      return;
    }

    const who=LEADERS.find(l=>l.email===email);
    if(!who || pass!==DEMO_PASS){ state.error=true; render(); return; }
    state.me=who; state.tab='jobs'; render();
  };
  document.getElementById('lg-btn').onclick=go;
  document.getElementById('lg-pass').onkeydown=(e)=>{ if(e.key==='Enter') go(); };
  document.getElementById('lg-email').oninput=(e)=>{ state.loginEmail=e.target.value; };
  document.getElementById('cfg-btn').onclick=()=>{ state.modal={type:'config'}; render(); };
}

  const stPill={new:'pill-flag',ordered:'pill-progress',resolved:'pill-done'};
  const stLabel={new:T.stNew,ordered:T.stOrdered,resolved:T.stResolved};
  return `
  <div class="sec-head reveal">
    <h1>${T.reqTitle}</h1>
    <div class="sub">${T.reqSub}</div>
  </div>
  <div class="glass glass-tile reveal">
    <div class="field">
      <label>${T.reqCat}</label>
      <div class="seg">
        ${CATS.map(c=>`<button class="chip ${state.reqCat===c?'is-on':''}" data-rcat="${c}">${T[CAT_KEY[c]]}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label>${T.reqUrg}</label>
      <div class="seg">
        ${['low','normal','urgent'].map(u=>`<button class="chip ${state.reqUrg===u?'is-on':''}" data-rurg="${u}">${T[u]}</button>`).join('')}
      </div>
    </div>
    <div class="field">
      <label for="r-note">${T.reqNote}</label>
      <textarea id="r-note" class="input" placeholder="${T.reqNotePh}">${esc(state.reqDraft.note)}</textarea>
    </div>
    <button class="btn btn-primary" id="r-send" style="width:100%">${T.reqSend}</button>
  </div>

  <div class="divider reveal"><span>${T.myReqs}</span></div>
  ${mine.length? mine.map((r,i)=>`
    <div class="glass glass-tile hist reveal" style="--i:${i}">
      <div class="hist-top">
        <b>${T[CAT_KEY[r.cat]]}</b>
        <span class="pill ${stPill[r.status]}">${stLabel[r.status]}</span>
      </div>
      <div class="meta">
        <span>${T[r.urgency]}</span><span class="dot">·</span><span>${ago(r.at)}</span>
      </div>
      <div class="note-box" style="margin-top:9px">${esc(r.note)}</div>
    </div>`).join('')
  : `<div class="glass empty reveal">${T.noReqs}</div>`}`;
}

/* ---------- Modales ---------- */
function renderModal(){
  const T=t(), m=state.modal;
  if(m.type==='config'){
    const c = Gamma.cfg || {url:'',key:''};
    return `<div class="scrim" data-close><div class="modal glass">
      <div class="modal-head">
        <div><h2 style="font-size:var(--t-lg)">${T.connect}</h2></div>
        <button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <p style="font-size:var(--t-sm);color:var(--text-dim);line-height:1.6;margin:0 0 14px">
        ${state.lang==='es'
          ? 'Pega aquí los datos del proyecto de Supabase de la empresa. Los encuentras en Settings → API. Con esto tus trabajos y tus reportes se comparten con la oficina.'
          : 'Paste the company Supabase project details. You will find them under Settings → API. This is what shares your jobs and reports with the office.'}
      </p>
      <div class="field"><label for="cf-url">Project URL</label>
        <input id="cf-url" class="input" placeholder="https://abcdefgh.supabase.co" value="${esc(c.url)}"></div>
      <div class="field"><label for="cf-key">Anon public key</label>
        <textarea id="cf-key" class="input" style="min-height:66px;font-size:12px">${esc(c.key)}</textarea></div>
      <div class="row2">
        ${Gamma.online()?`<button class="btn btn-wine" id="cf-off">${state.lang==='es'?'Desconectar':'Disconnect'}</button>`:''}
        <button class="btn btn-primary" id="cf-save">${state.lang==='es'?'Guardar y probar':'Save and test'}</button>
      </div>
    </div></div>`;
  }
  if(m.type==='sketch'){
    const j=state.jobs.find(x=>x.id===m.id);
    return `<div class="scrim" data-close><div class="modal glass">
      <div class="modal-head"><h2 style="font-size:var(--t-lg)">${T.viewSketch}</h2>
        <button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <img class="sketch" src="${j.sketch}" alt=""></div></div>`;
  }
  if(m.type==='done'){
    return `<div class="scrim" data-close><div class="modal glass">
      <div class="modal-head"><div><h2 style="font-size:var(--t-lg)">${T.doneTitle}</h2></div>
        <button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <p style="font-size:var(--t-sm);color:var(--text-dim);margin:0 0 14px;line-height:1.6">${T.donePrompt}</p>
      <label class="photo-drop" for="ph">
        ${state.photo?`<img src="${state.photo}" alt="">`:`<span>&#128247;</span><span>${T.addPhoto}</span>`}
      </label>
      <input type="file" accept="image/*" capture="environment" id="ph" style="display:none">
      <div class="row2">
        <button class="btn btn-glass" data-close-btn>${T.cancel}</button>
        <button class="btn btn-primary" id="ok-done" ${state.photo?'':'disabled'}>${T.confirmDone}</button>
      </div></div></div>`;
  }
  if(m.type==='flag'){
    return `<div class="scrim" data-close><div class="modal glass">
      <div class="modal-head"><div><h2 style="font-size:var(--t-lg)">${T.flagTitle}</h2></div>
        <button class="icon-btn" data-close aria-label="Close">&times;</button></div>
      <p style="font-size:var(--t-sm);color:var(--text-dim);margin:0 0 14px;line-height:1.6">${T.flagPrompt}</p>
      <textarea id="fl-reason" class="input" placeholder="${T.reasonPh}" style="margin-bottom:14px"></textarea>
      <div class="row2">
        <button class="btn btn-glass" data-close-btn>${T.cancel}</button>
        <button class="btn btn-wine" id="ok-flag">${T.confirmFlag}</button>
      </div></div></div>`;
  }
  return '';
}

/* ============================================================
   Eventos
   ============================================================ */
function bindApp(){
  const T=t();
  document.querySelectorAll('[data-lang]').forEach(b=>{
    b.onclick=()=>{ state.lang=b.dataset.lang; save('lang',state.lang); render(); };
  });
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.onclick=async()=>{
      state.tab=b.dataset.tab; render();
      if(online()){ const antes=snapshotSig(state); await refresh();
        if(snapshotSig(state)!==antes) render(); }
    };
  });
  document.getElementById('logout').onclick=async()=>{
    clearInterval(pollTimer);
    if(Gamma.online()) await Gamma.signOut();
    state.me=null; render();
  };

  document.querySelectorAll('[data-start]').forEach(b=>{
    b.onclick=()=>{
      const j=state.jobs.find(x=>x.id===b.dataset.start);
      j.status='progress'; j.startedAt=Date.now();
      toast(T.jobStarted);
      commit(()=>Gamma.rpc('crew_update_order',{p_order:j.id,p_state:'progress'}));
    };
  });
  document.querySelectorAll('[data-done]').forEach(b=>{
    b.onclick=()=>{ state.photo=null; state.modal={type:'done',id:b.dataset.done}; render(); };
  });
  document.querySelectorAll('[data-flag]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'flag',id:b.dataset.flag}; render(); };
  });
  document.querySelectorAll('[data-sketch]').forEach(b=>{
    b.onclick=()=>{ state.modal={type:'sketch',id:b.dataset.sketch}; render(); };
  });

  /* --- Vaciado --- */
  document.querySelectorAll('[data-dtype]').forEach(b=>{
    b.onclick=()=>{
      state.dumpType=b.dataset.dtype;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  const dw=document.getElementById('d-where'); if(dw) dw.oninput=(e)=>{ state.dumpDraft.where=e.target.value; };
  const dn=document.getElementById('d-notes'); if(dn) dn.oninput=(e)=>{ state.dumpDraft.notes=e.target.value; };
  const rn=document.getElementById('r-note');  if(rn) rn.oninput=(e)=>{ state.reqDraft.note=e.target.value; };

  document.getElementById('d-send')?.addEventListener('click',()=>{
    const where=document.getElementById('d-where').value.trim();
    if(!where){ toast(T.needWhere,'warn'); return; }
    const d={ id:uid('DR'), crew:state.me.crew, location:where, type:state.dumpType,
              notes:document.getElementById('d-notes').value.trim(), at:Date.now() };
    state.dumpDraft={where:'',notes:''};
    toast(T.dumpDone);
    if(!online()){ state.dumps.unshift(d); persist(); render(); return; }
    commit(()=>Gamma.insert('dump_reports', Map2.dumpToRow(d)));
  });

  /* --- Requerimientos --- */
  document.querySelectorAll('[data-rcat]').forEach(b=>{
    b.onclick=()=>{
      state.reqCat=b.dataset.rcat;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  document.querySelectorAll('[data-rurg]').forEach(b=>{
    b.onclick=()=>{
      state.reqUrg=b.dataset.rurg;
      b.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('is-on'));
      b.classList.add('is-on');
    };
  });
  document.getElementById('r-send')?.addEventListener('click',()=>{
    const note=document.getElementById('r-note').value.trim();
    if(!note){ toast(T.needNote,'warn'); return; }
    const r={ id:uid('RQ'), crew:state.me.crew, cat:state.reqCat,
              urgency:state.reqUrg, note, at:Date.now(), status:'new' };
    state.reqDraft={note:''};
    toast(T.reqDone);
    if(!online()){ state.requests.unshift(r); persist(); render(); return; }
    commit(()=>Gamma.insert('equipment_requests', Map2.reqToRow(r)));
  });
}

function bindModal(){
  const T=t();
  const close=()=>{ state.modal=null; state.photo=null; render(); };
  document.querySelectorAll('[data-close]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target===el) close(); };
  });
  document.querySelectorAll('[data-close-btn]').forEach(b=>{ b.onclick=close; });

  document.getElementById('cf-save')?.addEventListener('click',async()=>{
    const url=document.getElementById('cf-url').value.trim();
    const key=document.getElementById('cf-key').value.trim();
    const problem = urlProblem(url);
    if(problem || key.length<20){
      const es = state.lang==='es';
      state.error =
        problem==='DASHBOARD' ? (es
          ? 'Esa es la dirección del panel de Supabase, no la del proyecto. La que necesitas está en Settings → API → Project URL y se ve como https://abcdefgh.supabase.co'
          : 'That is the Supabase dashboard address, not the project one. You need Settings → API → Project URL, like https://abcdefgh.supabase.co')
      : problem ? (es
          ? 'Esa no parece la URL del proyecto. Debe verse como https://abcdefgh.supabase.co'
          : 'That does not look like the project URL. It should look like https://abcdefgh.supabase.co')
      : (es ? 'La llave anon parece incompleta.' : 'That anon key looks incomplete.');
      state.modal=null; render(); return;
    }
    const btn=document.getElementById('cf-save'); btn.disabled=true; btn.textContent=t().syncing;
    Gamma.configure(url,key);
    try{
      await Gamma.get('groups?select=id&limit=1');
      state.modal=null; render(); toast(t().connOn);
    }catch(e){
      Gamma.disconnect();
      const kind = /invalid path/i.test(e.message||'') ? 'PATH' : connectionHint(e);
      if(kind==='PATH'){
        state.error = state.lang==='es'
          ? 'La dirección llegó a Supabase pero llevaba algo de más. Pega solo https://abcdefgh.supabase.co, sin /rest/v1 al final ni barra.'
          : 'The URL reached Supabase but had something extra. Paste only https://abcdefgh.supabase.co — no /rest/v1, no trailing slash.';
        state.modal=null; render(); return;
      }
      state.error = kind==='SANDBOX'
        ? (state.lang==='es'
            ? 'Este enlace publicado no puede conectarse: corre en un entorno aislado que bloquea toda salida. Descarga el archivo y ábrelo desde el teléfono, o pídele a la oficina el enlace propio.'
            : 'This published link cannot connect: it runs in a sandbox that blocks all outside requests. Open the downloaded file instead, or ask the office for their own link.')
        : (kind==='NET'
            ? (state.lang==='es' ? 'No hubo respuesta de esa dirección. Revisa que esté completa.'
                                 : 'No answer from that URL. Check it is complete.')
            : e.message);
      state.modal=null; render();
    }
  });
  document.getElementById('cf-off')?.addEventListener('click',()=>{
    Gamma.disconnect(); clearInterval(pollTimer);
    state.me=null; state.modal=null; render();
  });

  document.getElementById('ph')?.addEventListener('change',(e)=>{
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ state.photo=r.result; render(); };
    r.readAsDataURL(f);
  });
  document.getElementById('ok-done')?.addEventListener('click',()=>{
    if(!state.photo){ toast(T.needPhoto,'warn'); return; }
    const j=state.jobs.find(x=>x.id===state.modal.id);
    const shot=state.photo;
    j.status='done'; j.photo=shot; j.completedAt=Date.now();
    close(); toast(T.jobDone);
    if(online()) commit(async()=>{
      const url=await Gamma.upload('completion-photos','done.jpg',shot);
      await Gamma.rpc('crew_update_order',{p_order:j.id,p_state:'done',p_photo:url});
    });
  });
  document.getElementById('ok-flag')?.addEventListener('click',()=>{
    const j=state.jobs.find(x=>x.id===state.modal.id);
    j.status='flag'; j.flagReason=document.getElementById('fl-reason').value.trim();
    const reason=j.flagReason;
    close(); toast(T.jobFlagged);
    if(online()) commit(()=>Gamma.rpc('crew_update_order',
      {p_order:j.id,p_state:'flag',p_reason:reason}));
  });
}

/* ---------- Arranque ---------- */
initGlass();
render();
</script>
