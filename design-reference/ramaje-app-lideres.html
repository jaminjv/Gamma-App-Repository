<!DOCTYPE html>
<html lang="es" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Ramaje — Crew App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1EDE3;
    --paper-dim:#E7E1D2;
    --ink:#2A241D;
    --ink-soft:#5C5346;
    --forest:#1E3A2E;
    --forest-2:#284A3A;
    --forest-3:#345E4B;
    --bark:#6B4A32;
    --safety:#E0631C;
    --safety-2:#F4834A;
    --sap:#5C7A52;
    --sap-bg:#E4ECDD;
    --rust:#A63D2E;
    --rust-bg:#F3DDD8;
    --line:#D3C9B4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  #app{max-width:460px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;padding-bottom:30px;}

  /* ===== Login ===== */
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:26px 22px;
    background:radial-gradient(circle at 20% 15%, rgba(255,255,255,0.05), transparent 45%), linear-gradient(165deg,var(--forest) 0%, #142A20 100%);}
  .login-lang{position:absolute;top:18px;right:18px;}
  .login-brand{display:flex;flex-direction:column;align-items:center;color:#EDE7D9;margin-bottom:30px;}
  .login-brand svg{width:42px;height:42px;margin-bottom:10px;}
  .login-brand h1{font-size:26px;letter-spacing:0.04em;}
  .login-brand p{font-family:'IBM Plex Mono',monospace;text-transform:none;font-size:11.5px;color:#B9C9BE;margin-top:4px;letter-spacing:0.02em;}
  .login-card{background:var(--paper);border-radius:8px;padding:20px 18px 22px;box-shadow:0 20px 50px rgba(0,0,0,0.3);}
  .login-card .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-soft);font-weight:600;margin-bottom:12px;}
  .leader-list{display:flex;flex-direction:column;gap:9px;}
  .leader-btn{
    display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:6px;
    padding:12px 14px;text-align:left;transition:.12s;
  }
  .leader-btn:active{transform:scale(0.98);background:var(--paper-dim);}
  .leader-avatar{
    width:38px;height:38px;border-radius:50%;background:var(--forest);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;
  }
  .leader-name{font-weight:700;font-size:14.5px;}
  .leader-crew{font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:1px;}

  /* Lang toggle */
  .lang-toggle{display:flex;background:rgba(255,255,255,0.12);border-radius:20px;padding:3px;gap:2px;}
  .lang-toggle button{background:transparent;border:none;color:#CBD7CC;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:16px;font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;}
  .lang-toggle button.active{background:var(--safety);color:#fff;}
  .lang-toggle.light{background:var(--paper-dim);}
  .lang-toggle.light button{color:var(--ink-soft);}
  .lang-toggle.light button.active{background:var(--forest);color:#fff;}

  /* ===== Header ===== */
  .topbar{
    background:var(--forest);color:#EDE7D9;padding:14px 16px 16px;position:sticky;top:0;z-index:20;
    border-bottom:4px solid var(--safety);
  }
  .topbar-row{display:flex;justify-content:space-between;align-items:center;}
  .topbar-brand{display:flex;align-items:center;gap:8px;}
  .topbar-brand svg{width:20px;height:20px;}
  .topbar-brand span{font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.03em;text-transform:uppercase;}
  .icon-btn{background:transparent;border:none;color:#CBD7CC;padding:6px;}
  .icon-btn svg{width:19px;height:19px;}
  .crew-banner{display:flex;align-items:center;justify-content:space-between;margin-top:12px;}
  .crew-who{display:flex;align-items:center;gap:10px;}
  .crew-avatar{width:36px;height:36px;border-radius:50%;background:var(--safety);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;}
  .crew-name{font-weight:700;font-size:15px;}
  .crew-sub{font-size:11px;color:#B9C9BE;font-family:'IBM Plex Mono',monospace;}
  .eq-chip{font-family:'IBM Plex Mono',monospace;font-size:9.5px;background:rgba(255,255,255,0.12);padding:3px 8px;border-radius:20px;color:#EDE7D9;text-transform:uppercase;}

  .stats-row{display:flex;gap:8px;padding:12px 16px 0;}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 10px 9px;}
  .stat .n{font-family:'Oswald',sans-serif;font-size:22px;color:var(--forest);line-height:1;}
  .stat.n-rust .n{color:var(--rust);}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:var(--ink-soft);font-weight:600;margin-top:3px;}

  .section{padding:16px 16px 4px;}
  .section h2{font-size:13px;color:var(--ink-soft);letter-spacing:0.05em;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section h2 .cnt{font-family:'IBM Plex Mono',monospace;font-size:10.5px;background:var(--paper-dim);padding:2px 7px;border-radius:10px;text-transform:none;letter-spacing:0;}

  .empty{text-align:center;padding:26px 10px;color:var(--ink-soft);font-size:12.5px;}

  /* ===== Job card ===== */
  .job{
    background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:13px 14px 14px;margin-bottom:11px;
    position:relative;
  }
  .job.flag{border-color:var(--rust);background:linear-gradient(0deg, rgba(166,61,46,0.04), rgba(166,61,46,0.04));}
  .job.done{opacity:0.9;}
  .job-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .job-addr{font-weight:700;font-size:14px;line-height:1.25;}
  .job-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);margin-top:4px;}
  .stamp{
    font-family:'Oswald',sans-serif;font-size:9px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;
    padding:3px 7px;border-radius:2px;border:1.5px solid;white-space:nowrap;flex:none;
  }
  .stamp.asignado{color:var(--bark);border-color:var(--bark);background:#F1E7DC;}
  .stamp.en_progreso{color:var(--safety);border-color:var(--safety);background:#FBE8DA;}
  .stamp.hecho{color:var(--sap);border-color:var(--sap);background:var(--sap-bg);}
  .stamp.reasignar{color:var(--rust);border-color:var(--rust);background:var(--rust-bg);}
  .job-instr{font-size:12.5px;color:var(--ink);background:var(--paper-dim);border-radius:5px;padding:8px 10px;margin-top:10px;line-height:1.4;}
  .job-instr b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin-bottom:3px;font-family:'Oswald',sans-serif;}
  .job-sketch{display:flex;align-items:center;gap:10px;margin-top:9px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;}
  .job-sketch img{width:40px;height:40px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex:none;}
  .job-sketch span{font-size:12px;font-weight:600;color:var(--forest-3);}
  .sketch-modal-img{width:100%;border-radius:8px;display:block;}

  .job-actions{display:flex;gap:8px;margin-top:12px;}
  .jbtn{flex:1;border:none;border-radius:5px;padding:11px 8px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
  .jbtn svg{width:15px;height:15px;}
  .jbtn-start{background:var(--forest);color:#fff;width:100%;}
  .jbtn-start:active{background:var(--forest-2);}
  .jbtn-done{background:var(--sap);color:#fff;}
  .jbtn-done:active{background:#4d6a44;}
  .jbtn-flag{background:transparent;color:var(--rust);border:1.5px solid var(--rust);}
  .jbtn-flag:active{background:var(--rust-bg);}

  .job-done-info{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);}
  .job-done-thumb{width:52px;height:52px;border-radius:5px;object-fit:cover;border:1px solid var(--line);flex:none;}
  .job-done-thumb-ph{width:52px;height:52px;border-radius:5px;background:var(--paper-dim);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-soft);}
  .job-done-thumb-ph svg{width:20px;height:20px;}
  .job-done-txt{font-size:11.5px;color:var(--ink-soft);}
  .job-done-txt b{color:var(--sap);display:block;font-size:12.5px;}

  .job-flag-info{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rust);font-size:12px;color:var(--rust);}
  .job-flag-info b{display:block;font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px;}

  /* ===== Modal ===== */
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,25,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:60;}
  .modal{background:var(--paper);width:100%;max-width:460px;border-radius:14px 14px 0 0;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,0.3);}
  .modal-handle{width:38px;height:4px;background:var(--line);border-radius:3px;margin:10px auto 2px;}
  .modal-hd{padding:14px 20px 4px;}
  .modal-hd h3{font-size:16px;color:var(--forest);}
  .modal-hd .addr{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .modal-body{padding:16px 20px 24px;}
  .photo-drop{
    border:2px dashed var(--line);border-radius:8px;padding:22px 14px;text-align:center;background:#fff;cursor:pointer;
  }
  .photo-drop svg{width:30px;height:30px;color:var(--ink-soft);margin-bottom:8px;}
  .photo-drop .t1{font-size:13px;font-weight:600;color:var(--ink);}
  .photo-drop .t2{font-size:11px;color:var(--ink-soft);margin-top:3px;}
  .photo-preview{width:100%;border-radius:8px;margin-top:2px;display:block;max-height:230px;object-fit:cover;}
  .field{margin-top:16px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600;margin-bottom:7px;}
  .field textarea{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:10px;font-size:13.5px;min-height:70px;resize:vertical;}
  .modal-actions{display:flex;gap:10px;margin-top:20px;}
  .btn-cancel{flex:1;background:transparent;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:6px;padding:12px;font-size:13px;font-weight:600;}
  .btn-confirm{flex:1.4;background:var(--sap);color:#fff;border:none;border-radius:6px;padding:12px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;font-size:13px;font-weight:600;}
  .btn-confirm:disabled{background:#C9C2B2;color:#8a8271;}
  .btn-confirm.flag-confirm{background:var(--rust);}

  .footer-note{text-align:center;font-size:10.5px;color:var(--ink-soft);padding:18px 20px 4px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>

function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,7); }

function initials(name){ return name.slice(0,2).toUpperCase(); }

/* ================= Seed data (mirrors the admin dashboard) ================= */

  const groups = [

  const orders = [

  lang:'es',
  loggedIn:null, // group id
  orders: [],
  groups: [],
  modal:null, // {type:'done'|'flag', id}
};
Object.assign(state, seedData());

/* ================= helpers ================= */
function myGroup(){ return state.groups.find(g=>g.id===state.loggedIn); }
function myOrders(){ return state.orders.filter(o=>o.group===state.loggedIn); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  const locale = state.lang==='es' ? 'es-CO' : 'en-US';
  return dt.toLocaleDateString(locale, {weekday:'short', day:'2-digit', month:'short'});
}
function nowTime(){ return new Date().toTimeString().slice(0,5); }

/* ================= RENDER ================= */
function render(){
  document.getElementById('html-root').lang = state.lang;
  const app = document.getElementById('app');
  if(!state.loggedIn){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  app.innerHTML = renderHome();
  if(state.modal) app.insertAdjacentHTML('beforeend', renderModal());
  attachEvents();
}

function renderLangToggle(light){
  return `
  <div class="lang-toggle ${light?'light':''}" id="lang-toggle">
    <button data-lang="es" class="${state.lang==='es'?'active':''}">ES</button>
    <button data-lang="en" class="${state.lang==='en'?'active':''}">EN</button>
  </div>`;
}

function renderLogin(){
  const tr = t();
  return `
  <div class="login-wrap">
    <div class="login-lang">${renderLangToggle(false)}</div>
    <div class="login-brand">
      ${ICONS.tree}
      <h1>${tr.appName}</h1>
      <p>${tr.appSub}</p>
    </div>
    <div class="login-card">
      <div class="lbl">${tr.whoAreYou}</div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;">${tr.pickLeader}</p>
      <div class="leader-list">
        ${state.groups.map(g=>`
          <button class="leader-btn" data-login="${g.id}">
            <div class="leader-avatar">${initials(g.lider)}</div>
            <div>
              <div class="leader-name">${g.lider}</div>
              <div class="leader-crew">${g.nombre}</div>
            </div>
          </button>`).join('')}
      </div>
    </div>
  </div>`;
}
function attachLoginEvents(){
  document.getElementById('lang-toggle').addEventListener('click', e=>{
    const b = e.target.closest('[data-lang]'); if(!b) return;
    state.lang = b.dataset.lang; render();
  });
  document.querySelectorAll('[data-login]').forEach(b=>{
    b.onclick = ()=>{ state.loggedIn = b.dataset.login; render(); };
  });
}

function renderHome(){
  const tr = t();
  const g = myGroup();
  const mine = myOrders();
  const active = mine.filter(o=>o.estado==='asignado' || o.estado==='en_progreso')
    .sort((a,b)=> (a.estado==='en_progreso'?0:1) - (b.estado==='en_progreso'?0:1) || a.fecha.localeCompare(b.fecha));
  const history = mine.filter(o=>o.estado==='hecho' || o.estado==='reasignar')
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));

  const todayISO = new Date().toISOString().slice(0,10);
  const jobsToday = mine.filter(o=>o.fecha===todayISO).length;
  const doneToday = mine.filter(o=>o.fecha===todayISO && o.estado==='hecho').length;
  const flaggedCount = mine.filter(o=>o.estado==='reasignar').length;

  return `
  <div class="topbar">
    <div class="topbar-row">
      <div class="topbar-brand">${ICONS.tree}<span>${tr.appName}</span></div>
      <div style="display:flex;align-items:center;gap:6px;">
        ${renderLangToggle(false)}
        <button class="icon-btn" id="logout-btn" title="${tr.changeUser}">${ICONS.logout}</button>
      </div>
    </div>
    <div class="crew-banner">
      <div class="crew-who">
        <div class="crew-avatar">${initials(g.lider)}</div>
        <div>
          <div class="crew-name">${g.lider}</div>
          <div class="crew-sub">${g.nombre}</div>
        </div>
      </div>
      <div class="eq-chip">${tr.equipoLabel[g.tipo_equipo]}</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="n">${jobsToday}</div><div class="l">${tr.jobsToday}</div></div>
    <div class="stat"><div class="n" style="color:var(--sap)">${doneToday}</div><div class="l">${tr.completedToday}</div></div>
    <div class="stat n-rust"><div class="n">${flaggedCount}</div><div class="l">${tr.flaggedCount}</div></div>
  </div>

  <div class="section">
    <h2>${tr.activeJobs} <span class="cnt">${active.length}</span></h2>
    ${active.length ? active.map(o=>renderJobCard(o)).join('') : `<div class="empty">${tr.noActive}</div>`}
  </div>

  <div class="section">
    <h2>${tr.historyJobs} <span class="cnt">${history.length}</span></h2>
    ${history.length ? history.map(o=>renderJobCard(o)).join('') : `<div class="empty">${tr.noHistory}</div>`}
  </div>

  <div class="footer-note">${tr.footerNote}</div>
  `;
}

function renderJobCard(o){
  const tr = t();
  let actions = '';
  let extra = '';

  if(o.estado==='asignado'){
    actions = `<div class="job-actions"><button class="jbtn jbtn-start" data-start="${o.id}">${ICONS.play}${tr.startJob}</button></div>`;
  } else if(o.estado==='en_progreso'){
    actions = `
    <div class="job-actions">
      <button class="jbtn jbtn-done" data-open-done="${o.id}">${ICONS.check}${tr.markDone}</button>
      <button class="jbtn jbtn-flag" data-open-flag="${o.id}">${ICONS.flag}${tr.cantComplete}</button>
    </div>`;
  } else if(o.estado==='hecho'){
    extra = `
    <div class="job-done-info">
      ${o.foto ? `<img class="job-done-thumb" src="${o.foto}">` : `<div class="job-done-thumb-ph">${ICONS.img}</div>`}
      <div class="job-done-txt"><b>${tr.completedAt}</b>${o.foto? '' : tr.noPhoto}</div>
    </div>`;
  } else if(o.estado==='reasignar'){
    extra = `
    <div class="job-flag-info">
      <b>${tr.flaggedAt}</b>
      ${o.motivo || ''}
    </div>`;
  }

  return `
  <div class="job ${o.estado==='reasignar'?'flag':''} ${o.estado==='hecho'?'done':''}">
    <div class="job-top">
      <div>
        <div class="job-addr">${o.direccion}</div>
        <div class="job-meta">${tr.tipoLabel[o.tipo]} · ${tr.equipoLabel[o.equipo]} · ${fmtDate(o.fecha)}</div>
      </div>
      <div class="stamp ${o.estado}">${tr.statusLabel[o.estado]}</div>
    </div>
    ${o.instrucciones ? `<div class="job-instr"><b>${tr.instructions}</b>${o.instrucciones}</div>` : ''}
    ${o.boceto ? `<div class="job-sketch" data-view-sketch="${o.id}"><img src="${o.boceto}"><span>${tr.viewDiagram}</span></div>` : ''}
    ${actions}
    ${extra}
  </div>`;
}

/* ================= Modals ================= */
function renderModal(){
  const tr = t();
  const o = state.orders.find(x=>x.id===state.modal.id);
  if(!o) return '';
  if(state.modal.type==='done'){
    return `
    <div class="modal-bg" data-close-modal>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-hd"><h3>${tr.doneModalTitle}</h3><div class="addr">${o.direccion}</div></div>
        <div class="modal-body">
          <label class="photo-drop" id="photo-drop">
            <div id="photo-drop-inner">
              ${ICONS.camera}
              <div class="t1">${tr.doneModalHint}</div>
              <div class="t2">${tr.doneModalHint2}</div>
            </div>
            <input type="file" accept="image/*" capture="environment" id="photo-file" style="display:none">
          </label>
          <div class="modal-actions">
            <button class="btn-cancel" data-close-modal>${tr.cancel}</button>
            <button class="btn-confirm" id="confirm-done" disabled>${tr.confirmDone}</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  if(state.modal.type==='flag'){
    return `
    <div class="modal-bg" data-close-modal>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-hd"><h3>${tr.flagModalTitle}</h3><div class="addr">${o.direccion}</div></div>
        <div class="modal-body">
          <p style="font-size:12.5px;color:var(--ink-soft);margin:0;">${tr.flagModalHint}</p>
          <div class="field">
            <label>${tr.reasonLabel}</label>
            <textarea id="flag-reason" placeholder="${tr.reasonPlaceholder}"></textarea>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" data-close-modal>${tr.cancel}</button>
            <button class="btn-confirm flag-confirm" id="confirm-flag">${tr.confirmFlag}</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  if(state.modal.type==='sketch'){
    return `
    <div class="modal-bg" data-close-modal>
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-hd"><h3>${tr.diagramTitle}</h3><div class="addr">${o.direccion}</div></div>
        <div class="modal-body" style="padding-top:4px;">
          <img class="sketch-modal-img" src="${o.boceto}">
          <div class="modal-actions">
            <button class="btn-cancel" style="flex:1;" data-close-modal>${tr.cancel}</button>
          </div>
        </div>
      </div>
    </div>`;
  }
  return '';
}

/* ================= Events ================= */
function attachEvents(){
  document.getElementById('lang-toggle').addEventListener('click', e=>{
    const b = e.target.closest('[data-lang]'); if(!b) return;
    state.lang = b.dataset.lang; render();
  });
  const logout = document.getElementById('logout-btn');
  if(logout) logout.onclick = ()=>{ state.loggedIn=null; render(); };

  document.querySelectorAll('[data-start]').forEach(b=>{
    b.onclick = ()=>{
      const o = state.orders.find(x=>x.id===b.dataset.start);
      o.estado = 'en_progreso';
      render();
    };
  });
  document.querySelectorAll('[data-open-done]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'done', id:b.dataset.openDone}; render(); };
  });
  document.querySelectorAll('[data-open-flag]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'flag', id:b.dataset.openFlag}; render(); };
  });
  document.querySelectorAll('[data-view-sketch]').forEach(b=>{
    b.onclick = ()=>{ state.modal = {type:'sketch', id:b.dataset.viewSketch}; render(); };
  });
  document.querySelectorAll('[data-close-modal]').forEach(b=>{
    b.onclick = (e)=>{ if(e.target===b){ state.modal=null; render(); } };
  });

  /* Done modal: photo capture */
  const photoDrop = document.getElementById('photo-drop');
  const photoFile = document.getElementById('photo-file');
  let pendingPhoto = null;
  if(photoDrop){
    photoDrop.onclick = ()=> photoFile.click();
    photoFile.onchange = ()=>{
      const f = photoFile.files[0]; if(!f) return;
      const reader = new FileReader();
      reader.onload = (e)=>{
        pendingPhoto = e.target.result;
        document.getElementById('photo-drop-inner').outerHTML = `<img class="photo-preview" src="${e.target.result}">`;
        document.getElementById('confirm-done').disabled = false;
      };
      reader.readAsDataURL(f);
    };
  }
  const confirmDone = document.getElementById('confirm-done');
  if(confirmDone) confirmDone.onclick = ()=>{
    if(!pendingPhoto) return;
    const o = state.orders.find(x=>x.id===state.modal.id);
    o.estado = 'hecho';
    o.foto = pendingPhoto;
    state.modal = null;
    render();
  };

  const confirmFlag = document.getElementById('confirm-flag');
  if(confirmFlag) confirmFlag.onclick = ()=>{
    const o = state.orders.find(x=>x.id===state.modal.id);
    o.estado = 'reasignar';
    o.motivo = document.getElementById('flag-reason').value.trim() || null;
    state.modal = null;
    render();
  };
}

render();
</script>
</body>
</html>
